<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CI/CD pipeline</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 940 600" role="img" aria-label="CI/CD pipeline">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">CI/CD Pipeline</text>
    <text class="small" x="24" y="56">The gates one commit passes through on its way to production</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 230 176 L 270 176" marker-end="url(#arrow)" />
    <path class="edge" d="M 230 366 L 270 366" marker-end="url(#arrow)" />
    <path class="edge" d="M 460 176 L 500 176" marker-end="url(#arrow)" />
    <path class="edge" d="M 460 366 L 500 366" marker-end="url(#arrow)" />
    <path class="edge" d="M 690 176 L 730 176" marker-end="url(#arrow)" />
    <path class="edge" d="M 690 366 L 730 366" marker-end="url(#arrow)" />
    <path class="edge" d="M 825 212 L 825 268 L 135 268 L 135 330" marker-end="url(#arrow)" />
    <path class="edge" d="M 365 402 L 365 450" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <path class="edge" d="M 825 402 L 825 480 L 690 480" stroke-dasharray="6 5" marker-end="url(#arrow)" />

    <rect class="node input" x="40" y="140" width="190" height="72" rx="8" />
    <rect class="node process" x="270" y="140" width="190" height="72" rx="8" />
    <rect class="node process" x="500" y="140" width="190" height="72" rx="8" />
    <rect class="node storage" x="730" y="140" width="190" height="72" rx="8" />
    <rect class="node process" x="40" y="330" width="190" height="72" rx="8" />
    <rect class="node process" x="270" y="330" width="190" height="72" rx="8" />
    <rect class="node external" x="500" y="330" width="190" height="72" rx="8" />
    <rect class="node process" x="730" y="330" width="190" height="72" rx="8" />
    <rect class="node risk" x="270" y="450" width="420" height="60" rx="8" />

    <text class="label" x="135" y="171" text-anchor="middle">Commit</text>
    <text class="small" x="135" y="193" text-anchor="middle">Push to feature branch</text>
    <text class="label" x="365" y="171" text-anchor="middle">Build</text>
    <text class="small" x="365" y="193" text-anchor="middle">Dependencies · Compile</text>
    <text class="label" x="595" y="171" text-anchor="middle">Unit Tests</text>
    <text class="small" x="595" y="193" text-anchor="middle">Lint · Coverage</text>
    <text class="label" x="825" y="171" text-anchor="middle">Image Build</text>
    <text class="small" x="825" y="193" text-anchor="middle">Tagged in registry</text>
    <text class="label" x="135" y="361" text-anchor="middle">Staging Deploy</text>
    <text class="small" x="135" y="383" text-anchor="middle">Same config as prod</text>
    <text class="label" x="365" y="361" text-anchor="middle">Integration Tests</text>
    <text class="small" x="365" y="383" text-anchor="middle">E2E · Smoke</text>
    <text class="label" x="595" y="361" text-anchor="middle">Approval</text>
    <text class="small" x="595" y="383" text-anchor="middle">A human presses this</text>
    <text class="label" x="825" y="361" text-anchor="middle">Production Deploy</text>
    <text class="small" x="825" y="383" text-anchor="middle">Rolling · Health check</text>
    <text class="label" x="480" y="475" text-anchor="middle">Halt and roll back to previous image</text>
    <text class="small" x="480" y="497" text-anchor="middle">A failed commit never reaches production</text>
    <text class="small" x="145" y="262">The same image flows on through every later stage</text>
    <text class="small" x="375" y="440">Fail</text>
    <text class="small" x="700" y="440" text-anchor="end">Deploy failed</text>
    <text class="small" x="24" y="566">Note: Solid lines are the success path, dashed lines the failure path. Only the approval is human; the rest is automatic.</text>
  </svg>
</main>

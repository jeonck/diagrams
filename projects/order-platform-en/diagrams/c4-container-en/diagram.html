<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C4 Context · Container</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1120 830" role="img" aria-label="C4 Context · Container">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">C4 Context · Container</text>
    <text class="small" x="24" y="56">The containers inside the system boundary, and the people and systems outside it</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 280 240 L 390 240" marker-end="url(#arrow)" />
    <path class="edge" d="M 510 290 L 510 370" marker-end="url(#arrow)" />
    <path class="edge" d="M 630 425 L 720 425" marker-end="url(#arrow)" />
    <path class="edge" d="M 460 480 L 460 650" marker-end="url(#arrow)" />
    <path class="edge" d="M 570 480 L 760 650" marker-end="url(#arrow)" />

    <rect class="zone" x="340" y="150" width="620" height="400" rx="10" />
    <rect class="node external" x="60" y="190" width="220" height="100" rx="8" />
    <rect class="node input" x="390" y="190" width="240" height="100" rx="8" />
    <rect class="node process" x="390" y="370" width="240" height="110" rx="8" />
    <rect class="node storage" x="720" y="370" width="210" height="110" rx="8" />
    <rect class="node neutral" x="340" y="650" width="250" height="100" rx="8" />
    <rect class="node neutral" x="650" y="650" width="250" height="100" rx="8" />

    <text class="small" x="342" y="140">Online Store — the system we build</text>
    <text class="label" x="170" y="225" text-anchor="middle">Customer</text>
    <text class="small" x="170" y="247" text-anchor="middle">[Person]</text>
    <text class="small" x="170" y="267" text-anchor="middle">Places orders</text>
    <text class="label" x="510" y="235" text-anchor="middle">Web App</text>
    <text class="small" x="510" y="257" text-anchor="middle">[Container: SPA]</text>
    <text class="label" x="510" y="420" text-anchor="middle">API Application</text>
    <text class="small" x="510" y="442" text-anchor="middle">[Container: Spring]</text>
    <text class="label" x="825" y="420" text-anchor="middle">Database</text>
    <text class="small" x="825" y="442" text-anchor="middle">[Container: PostgreSQL]</text>
    <text class="label" x="465" y="695" text-anchor="middle">Payment Gateway</text>
    <text class="small" x="465" y="717" text-anchor="middle">[External System]</text>
    <text class="label" x="775" y="695" text-anchor="middle">Email System</text>
    <text class="small" x="775" y="717" text-anchor="middle">[External System]</text>
    <text class="small" x="335" y="224" text-anchor="middle">Places order</text>
    <text class="small" x="585" y="334" text-anchor="middle">[JSON/HTTPS]</text>
    <text class="small" x="350" y="570" text-anchor="middle">Payment auth [HTTPS]</text>
    <text class="small" x="840" y="600" text-anchor="middle">Order confirmation [SMTP]</text>
    <text class="small" x="636" y="406">Read · write</text>
    <text class="small" x="24" y="774">Note: this is the container level (level 2) of C4. Inside the dashed border is what we deploy; outside it is what we do not build.</text>
    <text class="small" x="24" y="796">A container here is not a Docker container — it means “a unit that is deployed and runs on its own”.</text>
  </svg>
</main>

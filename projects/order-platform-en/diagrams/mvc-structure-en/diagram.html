<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MVC Diagram</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 900 710" role="img" aria-label="MVC Diagram">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">MVC (Model–View–Controller) pattern</text>
    <text class="small" x="24" y="56">A loop: user input → control → state change → screen refresh</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 390 182 L 190 306" marker-end="url(#arrow)" />
    <path class="edge" d="M 710 306 L 510 182" marker-end="url(#arrow)" />
    <path class="edge" d="M 190 410 L 390 522" marker-end="url(#arrow)" />
    <path class="edge" d="M 510 522 L 710 410" marker-end="url(#arrow)" />
    <path class="edge" d="M 310 358 L 590 358" stroke-dasharray="6 5" marker-end="url(#arrow)" />

    <rect class="node input" x="340" y="98" width="220" height="84" rx="8" />
    <rect class="node process" x="70" y="306" width="240" height="104" rx="8" />
    <rect class="node external" x="590" y="306" width="240" height="104" rx="8" />
    <rect class="node storage" x="330" y="522" width="240" height="104" rx="8" />

    <text class="label" x="450" y="135" text-anchor="middle">User</text>
    <text class="small" x="450" y="157" text-anchor="middle">Browser · client</text>
    <text class="label" x="190" y="343" text-anchor="middle">Controller</text>
    <text class="small" x="190" y="365" text-anchor="middle">Reads input · controls flow</text>
    <text class="small" x="190" y="385" text-anchor="middle">Request routing · validation</text>
    <text class="label" x="710" y="343" text-anchor="middle">View</text>
    <text class="small" x="710" y="365" text-anchor="middle">Presentation · rendering</text>
    <text class="small" x="710" y="385" text-anchor="middle">Templates · screen layout</text>
    <text class="label" x="450" y="559" text-anchor="middle">Model</text>
    <text class="small" x="450" y="581" text-anchor="middle">Domain data · state</text>
    <text class="small" x="450" y="601" text-anchor="middle">Business rules · persistence</text>
    <text class="small" x="250" y="246" text-anchor="end">① User input · request</text>
    <text class="small" x="650" y="246">④ Screen response</text>
    <text class="small" x="270" y="490" text-anchor="end">② State change request</text>
    <text class="small" x="630" y="490">③ Notify change · read data</text>
    <text class="small" x="450" y="348" text-anchor="middle">Pick view · trigger update</text>
    <text class="small" x="24" y="654">Note: the dashed line is the path that changes with the variant. In the Observer variant the</text>
    <text class="small" x="24" y="676">Model notifies the View directly; in Passive View the Controller refreshes the View.</text>
  </svg>
</main>

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order State Transitions</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1200 720" role="img" aria-label="Order State Transitions">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">Order State Transitions</text>
    <text class="small" x="24" y="56">The states a single order can be in, and the events that change them</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 160 210 L 230 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 420 210 L 560 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 750 210 L 890 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 985 250 L 985 360" marker-end="url(#arrow)" />
    <path class="edge" d="M 890 400 L 750 400" marker-end="url(#arrow)" />
    <path class="edge" d="M 325 250 L 325 360" marker-end="url(#arrow)" />
    <path class="edge" d="M 620 250 L 390 360" marker-end="url(#arrow)" />
    <path class="edge" d="M 655 440 L 655 560" marker-end="url(#arrow)" />
    <path class="edge" d="M 325 440 L 325 590 L 595 590" marker-end="url(#arrow)" />

    <rect class="node neutral" x="40" y="180" width="120" height="60" rx="8" />
    <rect class="node input" x="230" y="170" width="190" height="80" rx="8" />
    <rect class="node process" x="560" y="170" width="190" height="80" rx="8" />
    <rect class="node process" x="890" y="170" width="190" height="80" rx="8" />
    <rect class="node process" x="890" y="360" width="190" height="80" rx="8" />
    <rect class="node storage" x="560" y="360" width="190" height="80" rx="8" />
    <rect class="node risk" x="230" y="360" width="190" height="80" rx="8" />
    <rect class="node neutral" x="595" y="560" width="120" height="60" rx="8" />

    <text class="label" x="100" y="215" text-anchor="middle">Start</text>
    <text class="label" x="325" y="215" text-anchor="middle">Placed</text>
    <text class="label" x="655" y="215" text-anchor="middle">Paid</text>
    <text class="label" x="985" y="215" text-anchor="middle">Preparing</text>
    <text class="label" x="985" y="405" text-anchor="middle">Shipping</text>
    <text class="label" x="655" y="405" text-anchor="middle">Delivered</text>
    <text class="label" x="325" y="405" text-anchor="middle">Cancelled</text>
    <text class="label" x="655" y="595" text-anchor="middle">End</text>
    <text class="small" x="490" y="192" text-anchor="middle">Payment approved</text>
    <text class="small" x="820" y="192" text-anchor="middle">Stock reserved</text>
    <text class="small" x="1045" y="310" text-anchor="middle">Dispatched</text>
    <text class="small" x="820" y="378" text-anchor="middle">Receipt confirmed</text>
    <text class="small" x="235" y="310" text-anchor="middle">Customer cancels</text>
    <text class="small" x="700" y="320" text-anchor="middle">Payment cancelled · refunded</text>
    <text class="small" x="24" y="664">Note: a box is a state; the words on an arrow are the event that causes that transition.</text>
    <text class="small" x="24" y="686">“Start” and “End” stand in for the UML initial and final pseudostates. Only Delivered and Cancelled are end states.</text>
  </svg>
</main>

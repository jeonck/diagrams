<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web service deployment</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 940 780" role="img" aria-label="Web service deployment">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">Web Service Deployment</text>
    <text class="small" x="24" y="56">How a request crosses the edge into the app tier, and where reads split from writes</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 420 148 L 250 200" marker-end="url(#arrow)" />
    <path class="edge" d="M 520 148 L 690 200" marker-end="url(#arrow)" />
    <path class="edge" d="M 700 268 L 670 356" marker-end="url(#arrow)" />
    <path class="edge" d="M 560 396 L 370 396" marker-end="url(#arrow)" />
    <path class="edge" d="M 640 436 L 410 526" marker-end="url(#arrow)" />
    <path class="edge" d="M 680 436 L 675 526" marker-end="url(#arrow)" />
    <path class="edge" d="M 480 562 L 580 562" stroke-dasharray="6 5" marker-end="url(#arrow)" />

    <rect class="zone" x="60" y="176" width="820" height="112" rx="10" />
    <rect class="zone" x="60" y="316" width="820" height="330" rx="10" />
    <rect class="node external" x="380" y="88" width="180" height="60" rx="8" />
    <rect class="node external" x="150" y="200" width="200" height="68" rx="8" />
    <rect class="node process" x="580" y="200" width="240" height="68" rx="8" />
    <rect class="node process" x="570" y="368" width="220" height="68" rx="8" />
    <rect class="node process" x="562" y="360" width="220" height="68" rx="8" />
    <rect class="node storage" x="170" y="362" width="200" height="68" rx="8" />
    <rect class="node storage" x="280" y="526" width="200" height="72" rx="8" />
    <rect class="node storage" x="580" y="526" width="200" height="72" rx="8" />

    <text class="small" x="62" y="166">Public zone</text>
    <text class="small" x="62" y="306">Private subnet</text>
    <text class="label" x="470" y="113" text-anchor="middle">Browser</text>
    <text class="small" x="470" y="135" text-anchor="middle">User device</text>
    <text class="label" x="250" y="229" text-anchor="middle">CDN</text>
    <text class="small" x="250" y="251" text-anchor="middle">Static assets · Cache</text>
    <text class="label" x="700" y="229" text-anchor="middle">Load Balancer</text>
    <text class="small" x="700" y="251" text-anchor="middle">TLS termination · Health checks</text>
    <text class="label" x="672" y="389" text-anchor="middle">App Servers ×3</text>
    <text class="small" x="672" y="411" text-anchor="middle">Stateless · Autoscaled</text>
    <text class="label" x="270" y="391" text-anchor="middle">Cache (Redis)</text>
    <text class="small" x="270" y="413" text-anchor="middle">Sessions · Query results</text>
    <text class="label" x="380" y="557" text-anchor="middle">DB Primary</text>
    <text class="small" x="380" y="579" text-anchor="middle">Single write point</text>
    <text class="label" x="680" y="557" text-anchor="middle">DB Replica</text>
    <text class="small" x="680" y="579" text-anchor="middle">Read-only copy</text>
    <text class="small" x="300" y="142" text-anchor="middle">Static assets</text>
    <text class="small" x="645" y="142" text-anchor="middle">API requests</text>
    <text class="small" x="718" y="330" text-anchor="middle">Distribute</text>
    <text class="small" x="465" y="388" text-anchor="middle">Lookup · Session</text>
    <text class="small" x="462" y="480" text-anchor="middle">Write</text>
    <text class="small" x="706" y="480" text-anchor="middle">Read</text>
    <text class="small" x="530" y="552" text-anchor="middle">Replication</text>
    <text class="small" x="24" y="724">Note: The dashed rectangles are trust boundaries. Only the public zone is reachable directly from the internet; the private subnet is not.</text>
    <text class="small" x="24" y="746">App servers hold no state, so scaling means adding instances; sessions live in the cache and data in the database.</text>
  </svg>
</main>

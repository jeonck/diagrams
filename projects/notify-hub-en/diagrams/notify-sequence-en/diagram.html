<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notification Send Sequence</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1380 900" role="img" aria-label="Notification Send Sequence">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
      <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="var(--line)" stroke-width="1.4" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">Notification Send Sequence</text>
    <text class="small" x="24" y="56">One request from intake out to the provider, and where duplicates are filtered out</text>

    <!-- 생명선 -->
    <line class="zone" x1="130" y1="176" x2="130" y2="700" />
    <line class="zone" x1="410" y1="176" x2="410" y2="700" />
    <line class="zone" x1="690" y1="176" x2="690" y2="700" />
    <line class="zone" x1="970" y1="176" x2="970" y2="700" />
    <line class="zone" x1="1250" y1="176" x2="1250" y2="700" />

    <!-- 메시지: 노드보다 먼저 그려 화살표가 상자 뒤로 간다 -->
    <path class="edge" d="M 136 210 L 404 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 416 330 L 684 330" marker-end="url(#arrow)" />
    <path class="edge" d="M 404 375 L 136 375" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 696 425 L 964 425" marker-end="url(#arrow)" />
    <path class="edge" d="M 976 535 L 1244 535" marker-end="url(#arrow)" />
    <path class="edge" d="M 1244 580 L 976 580" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 964 630 L 696 630" marker-end="url(#arrow)" />
    <path class="edge" d="M 416 255 L 476 255 L 476 290 L 416 290" marker-end="url(#arrow)" />
    <path class="edge" d="M 976 465 L 1036 465 L 1036 500 L 976 500" marker-end="url(#arrow)" />

    <!-- 활성 구간 -->
    <rect class="node external" x="124" y="198" width="12" height="189" rx="2" />
    <rect class="node input" x="404" y="198" width="12" height="189" rx="2" />
    <rect class="node storage" x="684" y="318" width="12" height="324" rx="2" />
    <rect class="node process" x="964" y="413" width="12" height="229" rx="2" />
    <rect class="node neutral" x="1244" y="523" width="12" height="69" rx="2" />

    <!-- 참여자 -->
    <rect class="node external" x="15" y="96" width="230" height="80" rx="8" />
    <rect class="node input" x="295" y="96" width="230" height="80" rx="8" />
    <rect class="node storage" x="575" y="96" width="230" height="80" rx="8" />
    <rect class="node process" x="855" y="96" width="230" height="80" rx="8" />
    <rect class="node neutral" x="1135" y="96" width="230" height="80" rx="8" />

    <text class="label" x="130" y="128" text-anchor="middle">Order platform</text>
    <text class="small" x="130" y="150" text-anchor="middle">Sending service</text>
    <text class="label" x="410" y="128" text-anchor="middle">Intake API</text>
    <text class="small" x="410" y="150" text-anchor="middle">Responds at once</text>
    <text class="label" x="690" y="128" text-anchor="middle">Event queue</text>
    <text class="small" x="690" y="150" text-anchor="middle">At-least-once delivery</text>
    <text class="label" x="970" y="128" text-anchor="middle">Send worker</text>
    <text class="small" x="970" y="150" text-anchor="middle">Owns retries</text>
    <text class="label" x="1250" y="128" text-anchor="middle">Push provider</text>
    <text class="small" x="1250" y="150" text-anchor="middle">External system</text>

    <text class="small" x="270" y="200" text-anchor="middle">① POST /notifications (Idempotency-Key)</text>
    <text class="small" x="550" y="320" text-anchor="middle">③ Put on the queue</text>
    <text class="small" x="270" y="365" text-anchor="middle">202 Accepted</text>
    <text class="small" x="830" y="415" text-anchor="middle">④ Receive message</text>
    <text class="small" x="1110" y="525" text-anchor="middle">⑥ Send request (same idempotency key)</text>
    <text class="small" x="1110" y="570" text-anchor="middle">200 OK</text>
    <text class="small" x="830" y="620" text-anchor="middle">⑦ ack — remove from queue</text>
    <text class="small" x="488" y="276">② Check idempotency key</text>
    <text class="small" x="1048" y="486">⑤ Claim (conditional UPDATE)</text>
    <text class="small" x="24" y="800">Note: the Intake API only puts the event on the queue and returns 202 right away — it does not wait for the send result.</text>
    <text class="small" x="24" y="822">② guards the intake stage and ⑤ guards the worker stage (ADR 0003). If the UPDATE at ⑤ changes 0 rows,</text>
    <text class="small" x="24" y="844">another worker already took the message, so this one moves on quietly.</text>
    <text class="small" x="24" y="866">If the worker dies after ⑥ but before the result is recorded, a duplicate can still go out — so the provider gets the same key too.</text>
  </svg>
</main>

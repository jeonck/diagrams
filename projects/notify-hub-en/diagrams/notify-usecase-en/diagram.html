<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notification Hub Use Cases</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1160 780" role="img" aria-label="Notification Hub Use Cases">
    <text class="title" x="24" y="34">Notification Hub Use Cases</text>
    <text class="small" x="24" y="56">Who does what with this service</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 250 245 L 340 225" />
    <path class="edge" d="M 250 465 L 340 355" />
    <path class="edge" d="M 250 480 L 340 485" />
    <path class="edge" d="M 910 425 L 620 485" />
    <path class="edge" d="M 910 450 L 620 585" />

    <rect class="zone" x="300" y="130" width="560" height="520" rx="10" />
    <rect class="node external" x="60" y="200" width="190" height="90" rx="8" />
    <rect class="node external" x="60" y="430" width="190" height="90" rx="8" />
    <rect class="node external" x="910" y="400" width="190" height="90" rx="8" />
    <ellipse class="node input" cx="480.0" cy="225.0" rx="140.0" ry="45.0" />
    <ellipse class="node process" cx="480.0" cy="355.0" rx="140.0" ry="45.0" />
    <ellipse class="node process" cx="480.0" cy="485.0" rx="140.0" ry="45.0" />
    <ellipse class="node process" cx="480.0" cy="585.0" rx="140.0" ry="45.0" />

    <text class="small" x="302" y="120">Notification Hub (system boundary)</text>
    <text class="label" x="155" y="240" text-anchor="middle">Sending service</text>
    <text class="small" x="155" y="262" text-anchor="middle">e.g. order platform</text>
    <text class="label" x="155" y="480" text-anchor="middle">User</text>
    <text class="label" x="1005" y="450" text-anchor="middle">Operator</text>
    <text class="label" x="480" y="230" text-anchor="middle">Send a notification</text>
    <text class="label" x="480" y="360" text-anchor="middle">Manage channel preferences</text>
    <text class="label" x="480" y="490" text-anchor="middle">View delivery history</text>
    <text class="label" x="480" y="590" text-anchor="middle">Resend failed notifications</text>
    <text class="small" x="24" y="724">Note: the sending service is not a person, but it pushes requests in from outside, so it is drawn as an actor.</text>
    <text class="small" x="24" y="746">Receiving a notification is not a use case — only the things a user asks the system to do are use cases.</text>
  </svg>
</main>

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Failed Notification Handling (BPMN)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1280 820" role="img" aria-label="Failed Notification Handling (BPMN)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">Failed Notification Handling (BPMN)</text>
    <text class="small" x="24" y="56">How a person decides to requeue or give up on a notification that fell into the DLQ</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 355 265 L 380 265" marker-end="url(#arrow)" />
    <path class="edge" d="M 480 310 L 480 420 L 320 420 L 320 490" marker-end="url(#arrow)" />
    <path class="edge" d="M 420 535 L 470 535" marker-end="url(#arrow)" />
    <path class="edge" d="M 570 470 L 570 420 L 970 420 L 970 310" marker-end="url(#arrow)" />
    <path class="edge" d="M 570 600 L 570 640 L 820 640 L 820 580" marker-end="url(#arrow)" />
    <path class="edge" d="M 1080 265 L 1100 265" marker-end="url(#arrow)" />
    <path class="edge" d="M 920 535 L 1160 535 L 1160 305" marker-end="url(#arrow)" />

    <rect class="zone" x="150" y="150" width="1090" height="240" rx="10" />
    <rect class="zone" x="150" y="440" width="1090" height="250" rx="10" />
    <ellipse class="node neutral" cx="260.0" cy="265.0" rx="95.0" ry="50.0" />
    <rect class="node process" x="380" y="220" width="200" height="90" rx="8" />
    <rect class="node process" x="860" y="220" width="220" height="90" rx="8" />
    <ellipse class="node neutral" cx="1160.0" cy="265.0" rx="60.0" ry="40.0" />
    <rect class="node process" x="220" y="490" width="200" height="90" rx="8" />
    <path class="node external" d="M 570.0 470 L 670 535.0 L 570.0 600 L 470 535.0 Z" />
    <rect class="node risk" x="720" y="490" width="200" height="90" rx="8" />

    <text class="small" x="152" y="140">System</text>
    <text class="small" x="152" y="430">Operator</text>
    <text class="label" x="260" y="270" text-anchor="middle">Notification failed</text>
    <text class="label" x="480" y="270" text-anchor="middle">Notify operator</text>
    <text class="label" x="970" y="270" text-anchor="middle">Requeue notification</text>
    <text class="label" x="1160" y="270" text-anchor="middle">Done</text>
    <text class="label" x="320" y="540" text-anchor="middle">Check the cause</text>
    <text class="label" x="570" y="540" text-anchor="middle">Resend?</text>
    <text class="label" x="820" y="540" text-anchor="middle">Record as given up</text>
    <text class="small" x="400" y="410" text-anchor="middle">crosses the lane</text>
    <text class="small" x="770" y="410" text-anchor="middle">Yes</text>
    <text class="small" x="650" y="630" text-anchor="middle">No</text>
    <text class="small" x="24" y="764">Note: the horizontal bands are lanes — the top one is what the system does on its own, the bottom one is where a person decides.</text>
    <text class="small" x="24" y="786">An arrow crossing a lane is where ownership changes, and if the work stops there the notification just sits in the DLQ.</text>
  </svg>
</main>

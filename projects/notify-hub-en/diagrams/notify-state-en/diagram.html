<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notification Send State Transitions</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1220 760" role="img" aria-label="Notification Send State Transitions">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">Notification Send State Transitions</text>
    <text class="small" x="24" y="56">One notification from intake until it either succeeds or is given up</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 180 220 L 240 220" marker-end="url(#arrow)" />
    <path class="edge" d="M 410 220 L 490 220" marker-end="url(#arrow)" />
    <path class="edge" d="M 660 220 L 740 220" marker-end="url(#arrow)" />
    <path class="edge" d="M 910 220 L 990 220" marker-end="url(#arrow)" />
    <path class="edge" d="M 825 260 L 825 370" marker-end="url(#arrow)" />
    <path class="edge" d="M 740 410 L 660 410" marker-end="url(#arrow)" />
    <path class="edge" d="M 575 370 L 775 260" marker-end="url(#arrow)" />
    <path class="edge" d="M 825 450 L 825 550" marker-end="url(#arrow)" />
    <path class="edge" d="M 1075 260 L 1170 260 L 1170 585 L 1110 585" marker-end="url(#arrow)" />
    <path class="edge" d="M 920 590 L 990 590" marker-end="url(#arrow)" />

    <rect class="node neutral" x="60" y="190" width="120" height="60" rx="8" />
    <rect class="node input" x="240" y="180" width="170" height="80" rx="8" />
    <rect class="node process" x="490" y="180" width="170" height="80" rx="8" />
    <rect class="node process" x="740" y="180" width="170" height="80" rx="8" />
    <rect class="node storage" x="990" y="180" width="170" height="80" rx="8" />
    <rect class="node risk" x="740" y="370" width="170" height="80" rx="8" />
    <rect class="node process" x="490" y="370" width="170" height="80" rx="8" />
    <rect class="node risk" x="730" y="550" width="190" height="80" rx="8" />
    <rect class="node neutral" x="990" y="555" width="120" height="60" rx="8" />

    <text class="label" x="120" y="225" text-anchor="middle">Start</text>
    <text class="label" x="325" y="225" text-anchor="middle">Accepted</text>
    <text class="label" x="575" y="225" text-anchor="middle">Queued</text>
    <text class="label" x="825" y="225" text-anchor="middle">Sending</text>
    <text class="label" x="1075" y="225" text-anchor="middle">Sent</text>
    <text class="label" x="825" y="415" text-anchor="middle">Failed</text>
    <text class="label" x="575" y="415" text-anchor="middle">Retry wait</text>
    <text class="label" x="825" y="595" text-anchor="middle">Given up (DLQ)</text>
    <text class="label" x="1050" y="590" text-anchor="middle">End</text>
    <text class="small" x="450" y="202" text-anchor="middle">Enqueued</text>
    <text class="small" x="700" y="202" text-anchor="middle">Claimed</text>
    <text class="small" x="950" y="202" text-anchor="middle">Send OK</text>
    <text class="small" x="920" y="320" text-anchor="middle">Error · timeout</text>
    <text class="small" x="700" y="392" text-anchor="middle">&lt; 5 tries</text>
    <text class="small" x="560" y="305" text-anchor="middle">Retry after backoff</text>
    <text class="small" x="890" y="505" text-anchor="middle">&gt; 5 tries</text>
    <text class="small" x="24" y="704">Note: retries use exponential backoff up to 5 times; after that the notification goes to the DLQ and is given up.</text>
    <text class="small" x="24" y="726">“Given up” is an end state too — nothing vanishes quietly, every case stays on the record.</text>
  </svg>
</main>

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notification Hub CI/CD pipeline</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1180 600" role="img" aria-label="Notification Hub CI/CD pipeline">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">Notification Hub CI/CD Pipeline</text>
    <text class="small" x="24" y="56">How one commit ships two deployment units together</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 280 195 L 330 195" marker-end="url(#arrow)" />
    <path class="edge" d="M 280 395 L 330 395" marker-end="url(#arrow)" />
    <path class="edge" d="M 550 195 L 600 195" marker-end="url(#arrow)" />
    <path class="edge" d="M 550 395 L 600 395" marker-end="url(#arrow)" />
    <path class="edge" d="M 820 195 L 870 195" marker-end="url(#arrow)" />
    <path class="edge" d="M 820 395 L 870 395" marker-end="url(#arrow)" />
    <path class="edge" d="M 980 240 L 980 290 L 170 290 L 170 350" marker-end="url(#arrow)" />

    <rect class="node input" x="60" y="150" width="220" height="90" rx="8" />
    <rect class="node process" x="330" y="150" width="220" height="90" rx="8" />
    <rect class="node process" x="600" y="150" width="220" height="90" rx="8" />
    <rect class="node storage" x="870" y="150" width="220" height="90" rx="8" />
    <rect class="node process" x="60" y="350" width="220" height="90" rx="8" />
    <rect class="node process" x="330" y="350" width="220" height="90" rx="8" />
    <rect class="node external" x="600" y="350" width="220" height="90" rx="8" />
    <rect class="node process" x="870" y="350" width="220" height="90" rx="8" />

    <text class="label" x="170" y="190" text-anchor="middle">Commit</text>
    <text class="small" x="170" y="212" text-anchor="middle">Push to feature branch</text>
    <text class="label" x="440" y="190" text-anchor="middle">Build</text>
    <text class="small" x="440" y="212" text-anchor="middle">api · worker together</text>
    <text class="label" x="710" y="190" text-anchor="middle">Unit tests</text>
    <text class="small" x="710" y="212" text-anchor="middle">Per module</text>
    <text class="label" x="980" y="190" text-anchor="middle">Build 2 images</text>
    <text class="small" x="980" y="212" text-anchor="middle">Pushed with same tag</text>
    <text class="label" x="170" y="390" text-anchor="middle">Deploy to staging</text>
    <text class="small" x="170" y="412" text-anchor="middle">api · worker together</text>
    <text class="label" x="440" y="390" text-anchor="middle">Integration tests</text>
    <text class="small" x="440" y="412" text-anchor="middle">E2E through the queue</text>
    <text class="label" x="710" y="390" text-anchor="middle">Approval</text>
    <text class="small" x="710" y="412" text-anchor="middle">A human presses it</text>
    <text class="label" x="980" y="390" text-anchor="middle">Deploy to production</text>
    <text class="small" x="980" y="412" text-anchor="middle">worker first, api after</text>
    <text class="small" x="430" y="282" text-anchor="middle">The same image moves on to the later stages</text>
    <text class="small" x="24" y="544">Note: api and worker are built from the same commit and ship together — if their versions drift apart,</text>
    <text class="small" x="24" y="566">the message format on the queue no longer lines up. In production the worker goes first, so it can already read the new format.</text>
  </svg>
</main>

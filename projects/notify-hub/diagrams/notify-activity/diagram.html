<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>알림 발송 재시도 액티비티</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1080 1290" role="img" aria-label="알림 발송 재시도 액티비티">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">알림 발송 재시도 액티비티</text>
    <text class="small" x="24" y="56">발송 워커 한 사이클 — 선점하고, 성공하거나, 백오프 뒤 다시 돌거나, 포기하거나</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 540 130 L 540 170" marker-end="url(#arrow)" />
    <path class="edge" d="M 540 250 L 540 290" marker-end="url(#arrow)" />
    <path class="edge" d="M 410 350 L 300 350" marker-end="url(#arrow)" />
    <path class="edge" d="M 540 410 L 540 470" marker-end="url(#arrow)" />
    <path class="edge" d="M 60 350 L 30 350 L 30 1110 L 480 1110" marker-end="url(#arrow)" />
    <path class="edge" d="M 540 550 L 540 590" marker-end="url(#arrow)" />
    <path class="edge" d="M 670 650 L 760 650" marker-end="url(#arrow)" />
    <path class="edge" d="M 880 690 L 880 1110 L 600 1110" marker-end="url(#arrow)" />
    <path class="edge" d="M 540 710 L 540 770" marker-end="url(#arrow)" />
    <path class="edge" d="M 410 830 L 330 830" marker-end="url(#arrow)" />
    <path class="edge" d="M 220 790 L 220 510 L 420 510" marker-end="url(#arrow)" />
    <path class="edge" d="M 540 890 L 540 960" marker-end="url(#arrow)" />
    <path class="edge" d="M 540 1040 L 540 1080" marker-end="url(#arrow)" />

    <rect class="node neutral" x="480" y="70" width="120" height="60" rx="8" />
    <rect class="node process" x="420" y="170" width="240" height="80" rx="8" />
    <path class="node external" d="M 540.0 290 L 670 350.0 L 540.0 410 L 410 350.0 Z" />
    <rect class="node neutral" x="60" y="310" width="240" height="80" rx="8" />
    <rect class="node process" x="420" y="470" width="240" height="80" rx="8" />
    <path class="node external" d="M 540.0 590 L 670 650.0 L 540.0 710 L 410 650.0 Z" />
    <rect class="node storage" x="760" y="610" width="240" height="80" rx="8" />
    <path class="node external" d="M 540.0 770 L 670 830.0 L 540.0 890 L 410 830.0 Z" />
    <rect class="node process" x="110" y="790" width="220" height="80" rx="8" />
    <rect class="node risk" x="400" y="960" width="260" height="80" rx="8" />
    <rect class="node neutral" x="480" y="1080" width="120" height="60" rx="8" />

    <text class="label" x="540" y="105" text-anchor="middle">시작</text>
    <text class="label" x="540" y="215" text-anchor="middle">큐에서 메시지 수신</text>
    <text class="label" x="540" y="355" text-anchor="middle">상태 선점 성공?</text>
    <text class="label" x="180" y="355" text-anchor="middle">중복 — 조용히 넘어감</text>
    <text class="label" x="540" y="515" text-anchor="middle">공급자에 발송 요청</text>
    <text class="label" x="540" y="655" text-anchor="middle">성공?</text>
    <text class="label" x="880" y="655" text-anchor="middle">이력 기록 · ack</text>
    <text class="label" x="540" y="835" text-anchor="middle">재시도 5회 미만?</text>
    <text class="label" x="220" y="825" text-anchor="middle">백오프 대기</text>
    <text class="small" x="220" y="847" text-anchor="middle">1 · 2 · 4 · 8 · 16초</text>
    <text class="label" x="530" y="1005" text-anchor="middle">DLQ 이동 · 포기 기록</text>
    <text class="label" x="540" y="1115" text-anchor="middle">종료</text>
    <text class="small" x="355" y="332" text-anchor="middle">[갱신 0행]</text>
    <text class="small" x="612" y="446" text-anchor="middle">[갱신 1행]</text>
    <text class="small" x="715" y="632" text-anchor="middle">[성공]</text>
    <text class="small" x="600" y="746" text-anchor="middle">[실패]</text>
    <text class="small" x="370" y="812" text-anchor="middle">[5회 미만]</text>
    <text class="small" x="302" y="650" text-anchor="middle">백오프 뒤 재시도</text>
    <text class="small" x="608" y="930" text-anchor="middle">[5회 이상]</text>
    <text class="small" x="24" y="1212">※ 마름모는 분기입니다. 첫 분기가 ADR 0003 의 워커 단계 방어입니다 —</text>
    <text class="small" x="24" y="1234">조건부 UPDATE 로 상태를 선점해, 큐가 같은 메시지를 두 번 줘도 한 워커만 발송합니다.</text>
    <text class="small" x="24" y="1256">재시도는 같은 사이클을 다시 도는 것으로 그렸습니다.</text>
  </svg>
</main>

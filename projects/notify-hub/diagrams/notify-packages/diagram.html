<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모듈 의존 구조</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1080 660" role="img" aria-label="모듈 의존 구조">
    <defs>
      <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="var(--line)" stroke-width="1.5" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">모듈 의존 구조</text>
    <text class="small" x="24" y="56">따로 배포되는 두 모듈이 하나의 도메인을 공유하는 방식</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 470 210 L 600 300" stroke-dasharray="6 5" marker-end="url(#open)" />
    <path class="edge" d="M 850 210 L 760 300" stroke-dasharray="6 5" marker-end="url(#open)" />
    <path class="edge" d="M 660 460 L 660 390" stroke-dasharray="6 5" marker-end="url(#open)" />

    <rect class="node input" x="320" y="120" width="300" height="90" rx="8" />
    <rect class="node input" x="700" y="120" width="300" height="90" rx="8" />
    <rect class="node storage" x="510" y="300" width="300" height="90" rx="8" />
    <rect class="node neutral" x="510" y="460" width="300" height="90" rx="8" />

    <text class="label" x="470" y="160" text-anchor="middle">notify-api</text>
    <text class="small" x="470" y="182" text-anchor="middle">배포 단위 · 수신</text>
    <text class="label" x="850" y="160" text-anchor="middle">notify-worker</text>
    <text class="small" x="850" y="182" text-anchor="middle">배포 단위 · 발송</text>
    <text class="label" x="660" y="340" text-anchor="middle">notify-core</text>
    <text class="small" x="660" y="362" text-anchor="middle">도메인 · 포트</text>
    <text class="label" x="660" y="500" text-anchor="middle">notify-adapters</text>
    <text class="small" x="660" y="522" text-anchor="middle">SQS · 공급자 · DB</text>
    <text class="small" x="470" y="270" text-anchor="middle">«use»</text>
    <text class="small" x="880" y="270" text-anchor="middle">«use»</text>
    <text class="small" x="730" y="430" text-anchor="middle">«use»</text>
    <text class="small" x="400" y="350">나가는 의존 없음</text>
    <text class="small" x="24" y="604">※ notify-api 와 notify-worker 는 따로 배포되지만 같은 도메인 모듈을 씁니다.</text>
    <text class="small" x="24" y="626">notify-core 에서 나가는 화살표가 없다는 점은 온라인 상점의 domain 과 같은 규칙입니다.</text>
  </svg>
</main>

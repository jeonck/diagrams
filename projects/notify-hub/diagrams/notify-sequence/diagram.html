<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>알림 발송 시퀀스</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1380 800" role="img" aria-label="알림 발송 시퀀스">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
      <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="var(--line)" stroke-width="1.4" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">알림 발송 시퀀스</text>
    <text class="small" x="24" y="56">요청 한 건이 접수되어 공급자에게 나가기까지, 그리고 중복이 걸러지는 지점</text>

    <!-- 생명선 -->
    <line class="zone" x1="130" y1="176" x2="130" y2="640" />
    <line class="zone" x1="410" y1="176" x2="410" y2="640" />
    <line class="zone" x1="690" y1="176" x2="690" y2="640" />
    <line class="zone" x1="970" y1="176" x2="970" y2="640" />
    <line class="zone" x1="1250" y1="176" x2="1250" y2="640" />

    <!-- 메시지: 노드보다 먼저 그려 화살표가 상자 뒤로 간다 -->
    <path class="edge" d="M 136 210 L 404 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 416 330 L 684 330" marker-end="url(#arrow)" />
    <path class="edge" d="M 404 375 L 136 375" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 696 425 L 964 425" marker-end="url(#arrow)" />
    <path class="edge" d="M 976 475 L 1244 475" marker-end="url(#arrow)" />
    <path class="edge" d="M 1244 520 L 976 520" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 964 570 L 696 570" marker-end="url(#arrow)" />
    <path class="edge" d="M 416 255 L 476 255 L 476 290 L 416 290" marker-end="url(#arrow)" />

    <!-- 활성 구간 -->
    <rect class="node external" x="124" y="198" width="12" height="189" rx="2" />
    <rect class="node input" x="404" y="198" width="12" height="189" rx="2" />
    <rect class="node storage" x="684" y="318" width="12" height="264" rx="2" />
    <rect class="node process" x="964" y="413" width="12" height="169" rx="2" />
    <rect class="node neutral" x="1244" y="463" width="12" height="69" rx="2" />

    <!-- 참여자 -->
    <rect class="node external" x="15" y="96" width="230" height="80" rx="8" />
    <rect class="node input" x="295" y="96" width="230" height="80" rx="8" />
    <rect class="node storage" x="575" y="96" width="230" height="80" rx="8" />
    <rect class="node process" x="855" y="96" width="230" height="80" rx="8" />
    <rect class="node neutral" x="1135" y="96" width="230" height="80" rx="8" />

    <text class="label" x="130" y="128" text-anchor="middle">주문 플랫폼</text>
    <text class="small" x="130" y="150" text-anchor="middle">발신 서비스</text>
    <text class="label" x="410" y="128" text-anchor="middle">수신 API</text>
    <text class="small" x="410" y="150" text-anchor="middle">즉시 응답</text>
    <text class="label" x="690" y="128" text-anchor="middle">이벤트 큐</text>
    <text class="small" x="690" y="150" text-anchor="middle">적어도 한 번 전달</text>
    <text class="label" x="970" y="128" text-anchor="middle">발송 워커</text>
    <text class="small" x="970" y="150" text-anchor="middle">재시도 담당</text>
    <text class="label" x="1250" y="128" text-anchor="middle">푸시 공급자</text>
    <text class="small" x="1250" y="150" text-anchor="middle">외부 시스템</text>

    <text class="small" x="270" y="200" text-anchor="middle">① POST /notifications (Idempotency-Key)</text>
    <text class="small" x="550" y="320" text-anchor="middle">③ 큐에 적재</text>
    <text class="small" x="270" y="365" text-anchor="middle">202 Accepted</text>
    <text class="small" x="830" y="415" text-anchor="middle">④ 메시지 수신</text>
    <text class="small" x="1110" y="465" text-anchor="middle">⑤ 발송 요청</text>
    <text class="small" x="1110" y="510" text-anchor="middle">200 OK</text>
    <text class="small" x="830" y="560" text-anchor="middle">⑥ ack — 큐에서 삭제</text>
    <text class="small" x="488" y="276">② 멱등키 확인</text>
    <text class="small" x="24" y="722">※ 수신 API 는 큐에 넣기만 하고 곧바로 202 를 돌려줍니다 — 발송 결과를 기다리지 않습니다.</text>
    <text class="small" x="24" y="744">② 는 수신 단계의 중복만 막습니다. 큐가 같은 메시지를 두 번 전달하면 ④ 이후가 다시 실행되므로,</text>
    <text class="small" x="24" y="766">워커 단계의 중복은 이 그림에 아직 없습니다 — ADR 0003 의 열린 질문입니다.</text>
  </svg>
</main>

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>알림 허브 네트워크 토폴로지</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1180 900" role="img" aria-label="알림 허브 네트워크 토폴로지">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">알림 허브 네트워크 토폴로지</text>
    <text class="small" x="24" y="56">어떤 서브넷에 무엇이 있고, 어디로 나가는가</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 280 310 L 420 310" marker-end="url(#arrow)" />
    <path class="edge" d="M 530 350 L 530 470" marker-end="url(#arrow)" />
    <path class="edge" d="M 640 330 L 700 330 L 700 515 L 760 515" marker-end="url(#arrow)" />
    <path class="edge" d="M 880 470 L 880 350" marker-end="url(#arrow)" />
    <path class="edge" d="M 1000 310 L 1080 310 L 1080 720 L 1000 720" marker-end="url(#arrow)" />
    <path class="edge" d="M 760 720 L 280 720" marker-end="url(#arrow)" />

    <rect class="zone" x="320" y="180" width="820" height="640" rx="10" />
    <rect class="zone" x="360" y="240" width="740" height="150" rx="10" />
    <rect class="zone" x="360" y="440" width="740" height="160" rx="10" />
    <rect class="zone" x="360" y="650" width="740" height="130" rx="10" />
    <rect class="node external" x="60" y="265" width="220" height="90" rx="8" />
    <rect class="node process" x="420" y="270" width="220" height="80" rx="8" />
    <rect class="node process" x="760" y="270" width="240" height="80" rx="8" />
    <rect class="node storage" x="420" y="470" width="220" height="90" rx="8" />
    <rect class="node neutral" x="760" y="470" width="240" height="90" rx="8" />
    <rect class="node process" x="760" y="680" width="240" height="80" rx="8" />
    <rect class="node external" x="60" y="680" width="220" height="90" rx="8" />

    <text class="small" x="322" y="170">VPC 10.20.0.0/16</text>
    <text class="small" x="362" y="230">프라이빗 서브넷 · 앱 10.20.10.0/24</text>
    <text class="small" x="362" y="430">프라이빗 서브넷 · 데이터 10.20.20.0/24</text>
    <text class="small" x="362" y="640">퍼블릭 서브넷 10.20.1.0/24</text>
    <text class="label" x="170" y="315" text-anchor="middle">사내 서비스망</text>
    <text class="label" x="530" y="315" text-anchor="middle">수신 API ×2</text>
    <text class="label" x="880" y="315" text-anchor="middle">발송 워커 ×4</text>
    <text class="label" x="530" y="520" text-anchor="middle">이력 DB</text>
    <text class="label" x="880" y="520" text-anchor="middle">SQS VPC 엔드포인트</text>
    <text class="label" x="880" y="725" text-anchor="middle">NAT 게이트웨이</text>
    <text class="label" x="170" y="730" text-anchor="middle">푸시 · 이메일 공급자</text>
    <text class="small" x="350" y="292" text-anchor="middle">443</text>
    <text class="small" x="585" y="414" text-anchor="middle">5432</text>
    <text class="small" x="672" y="320" text-anchor="middle">적재</text>
    <text class="small" x="935" y="414" text-anchor="middle">선점</text>
    <text class="small" x="1085" y="520" text-anchor="middle">443 아웃바운드</text>
    <text class="small" x="520" y="703" text-anchor="middle">인터넷</text>
    <text class="small" x="24" y="822">※ 이 서비스는 인터넷에서 들어오는 경로가 없습니다 — 사내 서비스망에서만 요청이 옵니다.</text>
    <text class="small" x="24" y="844">나가는 트래픽만 NAT 를 거쳐 공급자에 닿습니다. 큐는 VPC 엔드포인트로 붙어 인터넷을 타지 않습니다.</text>
    <text class="small" x="24" y="866">발송 워커도 이력 DB 에 5432 로 붙습니다 — 선이 겹쳐 수신 API 경로만 그렸습니다.</text>
  </svg>
</main>

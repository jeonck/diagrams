<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>알림 허브 유스케이스</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1160 780" role="img" aria-label="알림 허브 유스케이스">
    <text class="title" x="24" y="34">알림 허브 유스케이스</text>
    <text class="small" x="24" y="56">누가 이 서비스로 무엇을 하는가</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 250 245 L 350 225" />
    <path class="edge" d="M 250 465 L 350 355" />
    <path class="edge" d="M 250 480 L 350 485" />
    <path class="edge" d="M 910 425 L 590 485" />
    <path class="edge" d="M 910 450 L 590 585" />

    <rect class="zone" x="300" y="130" width="560" height="520" rx="10" />
    <rect class="node external" x="60" y="200" width="190" height="90" rx="8" />
    <rect class="node external" x="60" y="430" width="190" height="90" rx="8" />
    <rect class="node external" x="910" y="400" width="190" height="90" rx="8" />
    <ellipse class="node input" cx="470.0" cy="225.0" rx="120.0" ry="45.0" />
    <ellipse class="node process" cx="470.0" cy="355.0" rx="120.0" ry="45.0" />
    <ellipse class="node process" cx="470.0" cy="485.0" rx="120.0" ry="45.0" />
    <ellipse class="node process" cx="470.0" cy="585.0" rx="120.0" ry="45.0" />

    <text class="small" x="302" y="120">알림 허브 (시스템 경계)</text>
    <text class="label" x="155" y="240" text-anchor="middle">발신 서비스</text>
    <text class="small" x="155" y="262" text-anchor="middle">주문 플랫폼 등</text>
    <text class="label" x="155" y="480" text-anchor="middle">사용자</text>
    <text class="label" x="1005" y="450" text-anchor="middle">운영자</text>
    <text class="label" x="470" y="230" text-anchor="middle">알림 요청 보내기</text>
    <text class="label" x="470" y="360" text-anchor="middle">채널 설정 관리</text>
    <text class="label" x="470" y="490" text-anchor="middle">발송 이력 조회</text>
    <text class="label" x="470" y="590" text-anchor="middle">실패 알림 재발송</text>
    <text class="small" x="24" y="724">※ 발신 서비스는 사람이 아니지만 시스템 밖에서 요청을 넣으므로 액터로 둡니다.</text>
    <text class="small" x="24" y="746">알림을 “받는” 것은 유스케이스가 아닙니다 — 사용자가 시스템에 시키는 일만 유스케이스입니다.</text>
  </svg>
</main>

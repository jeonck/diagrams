<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>알림 데이터 흐름 (레벨 1)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1080 840" role="img" aria-label="알림 데이터 흐름 (레벨 1)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">알림 데이터 흐름 (레벨 1)</text>
    <text class="small" x="24" y="56">알림 데이터가 어떤 처리를 거쳐 어디에 쌓이는가</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 240 225 L 340 225" marker-end="url(#arrow)" />
    <path class="edge" d="M 570 215 L 700 215" marker-end="url(#arrow)" />
    <path class="edge" d="M 455 280 L 455 400" marker-end="url(#arrow)" />
    <path class="edge" d="M 570 440 L 700 440" marker-end="url(#arrow)" />
    <path class="edge" d="M 700 470 L 570 470" marker-end="url(#arrow)" />
    <path class="edge" d="M 455 510 L 455 630" marker-end="url(#arrow)" />
    <path class="edge" d="M 570 675 L 700 675" marker-end="url(#arrow)" />

    <rect class="node external" x="60" y="180" width="180" height="90" rx="8" />
    <ellipse class="node process" cx="455.0" cy="225.0" rx="115.0" ry="55.0" />
    <rect class="node storage" x="700" y="185" width="240" height="80" rx="8" />
    <ellipse class="node process" cx="455.0" cy="455.0" rx="115.0" ry="55.0" />
    <rect class="node neutral" x="700" y="410" width="240" height="90" rx="8" />
    <ellipse class="node process" cx="455.0" cy="685.0" rx="115.0" ry="55.0" />
    <rect class="node storage" x="700" y="635" width="240" height="80" rx="8" />

    <text class="label" x="150" y="230" text-anchor="middle">발신 서비스</text>
    <text class="label" x="455" y="230" text-anchor="middle">1.0 요청 접수</text>
    <text class="label" x="820" y="230" text-anchor="middle">D1 알림 저장소</text>
    <text class="label" x="455" y="460" text-anchor="middle">2.0 발송</text>
    <text class="label" x="820" y="460" text-anchor="middle">외부 공급자</text>
    <text class="label" x="455" y="690" text-anchor="middle">3.0 재시도 · 포기</text>
    <text class="label" x="820" y="680" text-anchor="middle">D2 시도 이력</text>
    <text class="small" x="290" y="208" text-anchor="middle">알림 요청</text>
    <text class="small" x="635" y="198" text-anchor="middle">접수 레코드</text>
    <text class="small" x="520" y="344" text-anchor="middle">발송 대상</text>
    <text class="small" x="635" y="423" text-anchor="middle">발송 내용</text>
    <text class="small" x="635" y="490" text-anchor="middle">전송 결과</text>
    <text class="small" x="515" y="574" text-anchor="middle">실패 건</text>
    <text class="small" x="635" y="658" text-anchor="middle">시도 기록</text>
    <text class="small" x="24" y="784">※ 타원은 처리, D 로 시작하는 사각형은 데이터 저장소, 나머지는 외부 개체입니다.</text>
    <text class="small" x="24" y="806">DFD 는 데이터의 이동만 그립니다 — 재시도를 몇 번 하는지 같은 제어는 상태 전이 쪽에 있습니다.</text>
  </svg>
</main>

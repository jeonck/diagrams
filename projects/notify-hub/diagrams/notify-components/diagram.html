<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>수신 API 컴포넌트</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1080 700" role="img" aria-label="수신 API 컴포넌트">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">수신 API 컴포넌트</text>
    <text class="small" x="24" y="56">요청 하나가 수신 API 안에서 거치는 부품들</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 540 220 L 540 250" marker-end="url(#arrow)" />
    <path class="edge" d="M 540 320 L 540 350" marker-end="url(#arrow)" />
    <path class="edge" d="M 430 420 L 430 460" marker-end="url(#arrow)" />
    <path class="edge" d="M 660 420 L 660 460" marker-end="url(#arrow)" />
    <path class="edge" d="M 330 495 L 260 495" marker-end="url(#arrow)" />
    <path class="edge" d="M 760 495 L 850 495" marker-end="url(#arrow)" />

    <rect class="zone" x="300" y="110" width="480" height="470" rx="10" />
    <rect class="node input" x="350" y="150" width="380" height="70" rx="8" />
    <rect class="node process" x="350" y="250" width="380" height="70" rx="8" />
    <rect class="node process" x="350" y="350" width="380" height="70" rx="8" />
    <rect class="node storage" x="330" y="460" width="200" height="70" rx="8" />
    <rect class="node storage" x="560" y="460" width="200" height="70" rx="8" />
    <rect class="node neutral" x="60" y="455" width="200" height="80" rx="8" />
    <rect class="node neutral" x="850" y="455" width="200" height="80" rx="8" />

    <text class="small" x="302" y="100">수신 API</text>
    <text class="label" x="540" y="180" text-anchor="middle">HTTP Controller</text>
    <text class="small" x="540" y="202" text-anchor="middle">요청 검증 · 응답</text>
    <text class="label" x="540" y="280" text-anchor="middle">Idempotency Filter</text>
    <text class="small" x="540" y="302" text-anchor="middle">멱등키로 중복 걸러내기</text>
    <text class="label" x="540" y="380" text-anchor="middle">Notification Service</text>
    <text class="small" x="540" y="402" text-anchor="middle">접수 처리 흐름</text>
    <text class="label" x="430" y="500" text-anchor="middle">History Repository</text>
    <text class="label" x="660" y="500" text-anchor="middle">Queue Publisher</text>
    <text class="label" x="160" y="500" text-anchor="middle">이력 DB</text>
    <text class="label" x="950" y="500" text-anchor="middle">이벤트 큐</text>
    <text class="small" x="24" y="644">※ 점선 안의 상자가 컴포넌트이고, 바깥 두 개는 이 컴포넌트들이 쓰는 외부 자원입니다.</text>
    <text class="small" x="24" y="666">멱등 필터가 컨트롤러 바로 다음에 오는 것이 ADR 0003 의 ② 에 해당합니다.</text>
  </svg>
</main>

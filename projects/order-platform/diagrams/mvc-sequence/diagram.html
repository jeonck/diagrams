<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MVC 요청 처리 시퀀스</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1380 740" role="img" aria-label="MVC 요청 처리 시퀀스">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
      <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="var(--line)" stroke-width="1.4" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">MVC 요청 처리 시퀀스</text>
    <text class="small" x="24" y="56">주문 생성 요청 한 건이 각 역할을 거쳐 응답으로 돌아오기까지</text>

    <!-- 생명선 -->
    <line class="zone" x1="130" y1="176" x2="130" y2="645" />
    <line class="zone" x1="410" y1="176" x2="410" y2="645" />
    <line class="zone" x1="690" y1="176" x2="690" y2="645" />
    <line class="zone" x1="970" y1="176" x2="970" y2="645" />
    <line class="zone" x1="1250" y1="176" x2="1250" y2="645" />

    <!-- 메시지: 노드보다 먼저 그려 화살표가 상자 뒤로 간다 -->
    <path class="edge" d="M 136 220 L 404 220" marker-end="url(#arrow)" />
    <path class="edge" d="M 416 327 L 684 327" marker-end="url(#arrow)" />
    <path class="edge" d="M 696 371 L 964 371" marker-end="url(#arrow)" />
    <path class="edge" d="M 964 411 L 696 411" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 684 451 L 416 451" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 416 495 L 1244 495" marker-end="url(#arrow)" />
    <path class="edge" d="M 1244 535 L 416 535" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 404 575 L 136 575" stroke-dasharray="7 5" marker-end="url(#ret)" />
    <path class="edge" d="M 416 263 L 476 263 L 476 289 L 416 289" marker-end="url(#arrow)" />

    <!-- 활성 구간 -->
    <rect class="node input" x="124" y="210" width="12" height="375" rx="2" />
    <rect class="node process" x="404" y="210" width="12" height="375" rx="2" />
    <rect class="node storage" x="684" y="303" width="12" height="144" rx="2" />
    <rect class="node neutral" x="964" y="361" width="12" height="60" rx="2" />
    <rect class="node external" x="1244" y="485" width="12" height="60" rx="2" />

    <!-- 참여자 -->
    <rect class="node input" x="15" y="96" width="230" height="80" rx="8" />
    <rect class="node process" x="295" y="96" width="230" height="80" rx="8" />
    <rect class="node storage" x="575" y="96" width="230" height="80" rx="8" />
    <rect class="node neutral" x="855" y="96" width="230" height="80" rx="8" />
    <rect class="node external" x="1135" y="96" width="230" height="80" rx="8" />

    <text class="label" x="130" y="128" text-anchor="middle">사용자</text>
    <text class="small" x="130" y="150" text-anchor="middle">브라우저</text>
    <text class="label" x="410" y="128" text-anchor="middle">Controller</text>
    <text class="small" x="410" y="150" text-anchor="middle">요청 처리</text>
    <text class="label" x="690" y="128" text-anchor="middle">Model</text>
    <text class="small" x="690" y="150" text-anchor="middle">도메인 로직</text>
    <text class="label" x="970" y="128" text-anchor="middle">Repository</text>
    <text class="small" x="970" y="150" text-anchor="middle">영속성</text>
    <text class="label" x="1250" y="128" text-anchor="middle">View</text>
    <text class="small" x="1250" y="150" text-anchor="middle">렌더링</text>

    <text class="small" x="270" y="210" text-anchor="middle">① POST /orders</text>
    <text class="small" x="550" y="317" text-anchor="middle">③ createOrder(cmd)</text>
    <text class="small" x="830" y="361" text-anchor="middle">④ save(order)</text>
    <text class="small" x="830" y="401" text-anchor="middle">order #1024</text>
    <text class="small" x="550" y="441" text-anchor="middle">Order</text>
    <text class="small" x="830" y="485" text-anchor="middle">⑤ render(order)</text>
    <text class="small" x="830" y="525" text-anchor="middle">HTML</text>
    <text class="small" x="270" y="565" text-anchor="middle">200 OK + HTML</text>
    <text class="small" x="488" y="280">② 입력 검증</text>
    <text class="small" x="24" y="684">※ 실선은 호출, 점선은 반환입니다. 세로 막대는 각 참여자가 처리 중인 구간을 뜻합니다.</text>
    <text class="small" x="24" y="706">Repository는 MVC의 세 역할이 아니라 Model이 영속성을 맡길 대상이라 회색으로 두었습니다.</text>
  </svg>
</main>

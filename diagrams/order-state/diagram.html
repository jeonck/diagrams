<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주문 상태 전이</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1120 720" role="img" aria-label="주문 상태 전이">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">주문 상태 전이</text>
    <text class="small" x="24" y="56">주문 한 건이 가질 수 있는 상태와, 상태를 바꾸는 사건</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 180 210 L 240 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 430 210 L 490 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 680 210 L 740 210" marker-end="url(#arrow)" />
    <path class="edge" d="M 835 250 L 835 360" marker-end="url(#arrow)" />
    <path class="edge" d="M 740 400 L 680 400" marker-end="url(#arrow)" />
    <path class="edge" d="M 335 250 L 335 360" marker-end="url(#arrow)" />
    <path class="edge" d="M 530 250 L 400 360" marker-end="url(#arrow)" />
    <path class="edge" d="M 585 440 L 585 560" marker-end="url(#arrow)" />
    <path class="edge" d="M 335 440 L 335 590 L 490 590" marker-end="url(#arrow)" />

    <rect class="node neutral" x="60" y="180" width="120" height="60" rx="8" />
    <rect class="node input" x="240" y="170" width="190" height="80" rx="8" />
    <rect class="node process" x="490" y="170" width="190" height="80" rx="8" />
    <rect class="node process" x="740" y="170" width="190" height="80" rx="8" />
    <rect class="node process" x="740" y="360" width="190" height="80" rx="8" />
    <rect class="node storage" x="490" y="360" width="190" height="80" rx="8" />
    <rect class="node risk" x="240" y="360" width="190" height="80" rx="8" />
    <rect class="node neutral" x="490" y="560" width="120" height="60" rx="8" />

    <text class="label" x="120" y="215" text-anchor="middle">시작</text>
    <text class="label" x="335" y="215" text-anchor="middle">접수됨</text>
    <text class="label" x="585" y="215" text-anchor="middle">결제완료</text>
    <text class="label" x="835" y="215" text-anchor="middle">준비중</text>
    <text class="label" x="835" y="405" text-anchor="middle">배송중</text>
    <text class="label" x="585" y="405" text-anchor="middle">배송완료</text>
    <text class="label" x="335" y="405" text-anchor="middle">취소됨</text>
    <text class="label" x="550" y="595" text-anchor="middle">종료</text>
    <text class="small" x="460" y="192" text-anchor="middle">결제 승인</text>
    <text class="small" x="710" y="192" text-anchor="middle">재고 확보</text>
    <text class="small" x="880" y="310" text-anchor="middle">출고</text>
    <text class="small" x="710" y="378" text-anchor="middle">수령 확인</text>
    <text class="small" x="280" y="310" text-anchor="middle">고객 취소</text>
    <text class="small" x="560" y="320" text-anchor="middle">결제 취소 · 환불</text>
    <text class="small" x="24" y="664">※ 상자는 상태, 화살표 위 글자는 그 전이를 일으키는 사건입니다.</text>
    <text class="small" x="24" y="686">“시작”과 “종료”는 UML 의 시작·종료 의사상태를 대신합니다. 배송완료와 취소됨에서만 끝납니다.</text>
  </svg>
</main>

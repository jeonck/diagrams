<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주문 이행 프로세스 (BPMN)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1200 760" role="img" aria-label="주문 이행 프로세스 (BPMN)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">주문 이행 프로세스 (BPMN)</text>
    <text class="small" x="24" y="56">주문 한 건이 부서를 넘나들며 처리되는 순서</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 310 255 L 360 260" marker-end="url(#arrow)" />
    <path class="edge" d="M 560 260 L 610 260" marker-end="url(#arrow)" />
    <path class="edge" d="M 820 260 L 880 260" marker-end="url(#arrow)" />
    <path class="edge" d="M 715 325 L 715 420 L 460 420 L 460 490" marker-end="url(#arrow)" />
    <path class="edge" d="M 560 535 L 620 535" marker-end="url(#arrow)" />
    <path class="edge" d="M 820 535 L 890 535" marker-end="url(#arrow)" />
    <path class="edge" d="M 1080 305 L 1120 305 L 1120 535 L 1020 535" marker-end="url(#arrow)" />

    <rect class="zone" x="150" y="150" width="1010" height="250" rx="10" />
    <rect class="zone" x="150" y="440" width="1010" height="230" rx="10" />
    <ellipse class="node neutral" cx="245.0" cy="255.0" rx="65.0" ry="50.0" />
    <rect class="node process" x="360" y="215" width="200" height="90" rx="8" />
    <path class="node external" d="M 715.0 195 L 820 260.0 L 715.0 325 L 610 260.0 Z" />
    <rect class="node risk" x="880" y="215" width="200" height="90" rx="8" />
    <rect class="node process" x="360" y="490" width="200" height="90" rx="8" />
    <rect class="node process" x="620" y="490" width="200" height="90" rx="8" />
    <ellipse class="node neutral" cx="955.0" cy="535.0" rx="65.0" ry="45.0" />

    <text class="small" x="152" y="140">상점 — 주문 처리</text>
    <text class="small" x="152" y="430">상점 — 배송</text>
    <text class="label" x="245" y="260" text-anchor="middle">주문 접수</text>
    <text class="label" x="460" y="265" text-anchor="middle">결제 확인</text>
    <text class="label" x="715" y="265" text-anchor="middle">결제 성공?</text>
    <text class="label" x="980" y="265" text-anchor="middle">취소 안내</text>
    <text class="label" x="460" y="540" text-anchor="middle">상품 포장</text>
    <text class="label" x="720" y="540" text-anchor="middle">배송 위탁</text>
    <text class="label" x="955" y="540" text-anchor="middle">완료</text>
    <text class="small" x="850" y="242" text-anchor="middle">아니오</text>
    <text class="small" x="690" y="404" text-anchor="middle">예</text>
    <text class="small" x="24" y="704">※ 가로 띠는 레인(누가 하는가), 원은 시작·종료 이벤트, 마름모는 게이트웨이(분기)입니다.</text>
    <text class="small" x="24" y="726">레인을 넘는 화살표는 담당이 바뀌는 지점이고, BPMN 에서 사고가 가장 잦은 곳이기도 합니다.</text>
  </svg>
</main>

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주문 기능 값 흐름</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1250 640" role="img" aria-label="주문 기능 값 흐름">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">주문 기능 값 흐름</text>
    <text class="small" x="24" y="56">요구 하나가 배포되기까지, 일한 시간과 기다린 시간</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 230 235 L 250 235" marker-end="url(#arrow)" />
    <path class="edge" d="M 420 235 L 440 235" marker-end="url(#arrow)" />
    <path class="edge" d="M 610 235 L 630 235" marker-end="url(#arrow)" />
    <path class="edge" d="M 800 235 L 820 235" marker-end="url(#arrow)" />
    <path class="edge" d="M 990 235 L 1010 235" marker-end="url(#arrow)" />

    <rect class="node process" x="60" y="180" width="170" height="110" rx="8" />
    <rect class="node process" x="250" y="180" width="170" height="110" rx="8" />
    <rect class="node process" x="440" y="180" width="170" height="110" rx="8" />
    <rect class="node process" x="630" y="180" width="170" height="110" rx="8" />
    <rect class="node process" x="820" y="180" width="170" height="110" rx="8" />
    <rect class="node process" x="1010" y="180" width="170" height="110" rx="8" />
    <rect class="node storage" x="60" y="420" width="260" height="100" rx="8" />
    <rect class="node risk" x="350" y="420" width="260" height="100" rx="8" />
    <rect class="node neutral" x="640" y="420" width="260" height="100" rx="8" />
    <rect class="node external" x="930" y="420" width="260" height="100" rx="8" />

    <text class="label" x="145" y="220" text-anchor="middle">요구 정리</text>
    <text class="small" x="145" y="242" text-anchor="middle">처리 0.5일</text>
    <text class="small" x="145" y="262" text-anchor="middle">대기 2일</text>
    <text class="label" x="335" y="220" text-anchor="middle">설계</text>
    <text class="small" x="335" y="242" text-anchor="middle">처리 1일</text>
    <text class="small" x="335" y="262" text-anchor="middle">대기 3일</text>
    <text class="label" x="525" y="220" text-anchor="middle">구현</text>
    <text class="small" x="525" y="242" text-anchor="middle">처리 3일</text>
    <text class="small" x="525" y="262" text-anchor="middle">대기 1일</text>
    <text class="label" x="715" y="220" text-anchor="middle">코드 리뷰</text>
    <text class="small" x="715" y="242" text-anchor="middle">처리 0.5일</text>
    <text class="small" x="715" y="262" text-anchor="middle">대기 4일</text>
    <text class="label" x="905" y="220" text-anchor="middle">QA</text>
    <text class="small" x="905" y="242" text-anchor="middle">처리 1일</text>
    <text class="small" x="905" y="262" text-anchor="middle">대기 3일</text>
    <text class="label" x="1095" y="220" text-anchor="middle">배포</text>
    <text class="small" x="1095" y="242" text-anchor="middle">처리 0.5일</text>
    <text class="small" x="1095" y="262" text-anchor="middle">대기 2.5일</text>
    <text class="label" x="190" y="465" text-anchor="middle">처리 시간 합계</text>
    <text class="small" x="190" y="487" text-anchor="middle">6.5일</text>
    <text class="label" x="480" y="465" text-anchor="middle">대기 시간 합계</text>
    <text class="small" x="480" y="487" text-anchor="middle">15.5일</text>
    <text class="label" x="770" y="465" text-anchor="middle">리드타임</text>
    <text class="small" x="770" y="487" text-anchor="middle">22일</text>
    <text class="label" x="1060" y="465" text-anchor="middle">흐름 효율</text>
    <text class="small" x="1060" y="487" text-anchor="middle">6.5 ÷ 22 = 30%</text>
    <text class="small" x="24" y="584">※ 숫자는 설명을 위한 예시 값입니다. 실제 측정치로 바꿔 쓰십시오.</text>
    <text class="small" x="24" y="606">리드타임의 70% 가 대기입니다 — 각 단계를 더 빠르게 하는 것보다 대기를 줄이는 편이 크게 남습니다.</text>
  </svg>
</main>

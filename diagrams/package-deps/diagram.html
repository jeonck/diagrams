<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>패키지 의존 구조</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .arrow-head {
    fill: var(--line);
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 1080 660" role="img" aria-label="패키지 의존 구조">
    <defs>
      <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="var(--line)" stroke-width="1.5" />
      </marker>
    </defs>

    <text class="title" x="24" y="34">패키지 의존 구조</text>
    <text class="small" x="24" y="56">어느 패키지가 어느 패키지를 알아도 되는가</text>

    <!-- 연결선을 먼저 그려 화살표가 상자 뒤로 가게 한다 -->
    <path class="edge" d="M 530 220 L 530 290" stroke-dasharray="6 5" marker-end="url(#open)" />
    <path class="edge" d="M 530 380 L 530 450" stroke-dasharray="6 5" marker-end="url(#open)" />
    <path class="edge" d="M 880 380 L 690 470" stroke-dasharray="6 5" marker-end="url(#open)" />

    <rect class="node input" x="380" y="130" width="300" height="90" rx="8" />
    <rect class="node process" x="380" y="290" width="300" height="90" rx="8" />
    <rect class="node storage" x="380" y="450" width="300" height="90" rx="8" />
    <rect class="node neutral" x="760" y="290" width="280" height="90" rx="8" />

    <text class="label" x="530" y="170" text-anchor="middle">web</text>
    <text class="small" x="530" y="192" text-anchor="middle">컨트롤러 · 뷰 · DTO</text>
    <text class="label" x="530" y="330" text-anchor="middle">application</text>
    <text class="small" x="530" y="352" text-anchor="middle">유스케이스 · 트랜잭션 경계</text>
    <text class="label" x="530" y="490" text-anchor="middle">domain</text>
    <text class="small" x="530" y="512" text-anchor="middle">엔티티 · 값 객체 · 포트</text>
    <text class="label" x="900" y="330" text-anchor="middle">infrastructure</text>
    <text class="small" x="900" y="352" text-anchor="middle">JPA · 외부 API 어댑터</text>
    <text class="small" x="575" y="260" text-anchor="middle">«use»</text>
    <text class="small" x="575" y="420" text-anchor="middle">«use»</text>
    <text class="small" x="768" y="398" text-anchor="middle">«use»</text>
    <text class="small" x="700" y="505">나가는 의존 없음</text>
    <text class="small" x="24" y="604">※ 화살표는 “이 패키지가 저 패키지를 안다”는 뜻입니다.</text>
    <text class="small" x="24" y="626">domain 에서 나가는 화살표가 하나도 없다는 점이 핵심입니다 — 도메인은 아무것도 의존하지 않습니다.</text>
  </svg>
</main>

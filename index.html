<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagrams</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --card: #ffffff;
    --fg: #172033;
    --muted: #5b6475;
    --line: #cbd5e1;
    --hair: #e2e8f0;
    --sunk: #f1f5f9;
    --sel: #eef2ff;
    --accent: #4338ca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #111c33;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #334155;
      --hair: #1e293b;
      --sunk: #172033;
      --sel: #1e1b4b;
      --accent: #a5b4fc;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  a { color: var(--accent); }
  input, button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .topbar {
    display: flex; align-items: center; gap: 16px;
    height: 56px; padding: 0 24px; flex-shrink: 0;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .home {
    padding: 4px 8px; margin-left: -8px; border: 0; border-radius: 7px;
    background: transparent; cursor: pointer;
    font-size: 16px; font-weight: 650; letter-spacing: -0.01em;
  }
  .brand .home:hover { background: var(--sunk); color: var(--accent); }
  .count { font-size: 12px; color: var(--muted); }
  .spacer { flex-grow: 1; }
  .sr {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; border: 0; overflow: hidden; clip-path: inset(50%);
  }
  .navtoggle {
    display: none; align-items: center; justify-content: center;
    width: 38px; height: 38px; margin-left: -8px;
    border: 0; border-radius: 9px; background: transparent;
    color: var(--muted); cursor: pointer;
  }
  .navtoggle .ic-close { display: none; }
  body[data-nav="true"] .navtoggle { background: var(--sel); color: var(--accent); }
  body[data-nav="true"] .navtoggle .ic-open { display: none; }
  body[data-nav="true"] .navtoggle .ic-close { display: block; }

  .seg { display: flex; gap: 4px; padding: 3px; background: var(--sunk); border-radius: 8px; }
  .seg button {
    padding: 5px 12px; border: 0; border-radius: 6px; background: transparent;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] {
    background: var(--card); color: var(--accent); font-weight: 600;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.1);
  }

  .body { display: flex; flex-grow: 1; min-height: 0; }

  .sidebar {
    display: flex; flex-direction: column; width: 288px; flex-shrink: 0;
    background: var(--card); border-right: 1px solid var(--line);
  }
  .projectpick { padding: 0 16px 10px; }
  .projectpick select {
    width: 100%; height: 34px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg); font-size: 13px;
  }
  .project { padding: 16px 16px 4px; }
  .project strong { display: block; font-size: 14px; font-weight: 650; }
  .project span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); line-height: 1.45; text-wrap: pretty; }
  .axiswrap { padding: 0 16px 12px; }
  .axiswrap .seg { justify-content: stretch; }
  .axiswrap .seg button { flex-grow: 1; }
  .searchwrap { padding: 10px 16px 10px; }
  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px; height: 36px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  }
  .search:focus-within { border-color: var(--accent); }
  .search input {
    flex-grow: 1; min-width: 0; border: 0; background: transparent;
    font-size: 13px; outline: none;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .tag {
    padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .tag.more { border-style: dashed; }
  .tag[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent); background: var(--sel); font-weight: 600;
  }

  .list { flex-grow: 1; overflow: auto; border-top: 1px solid var(--hair); padding: 8px 0 16px; }
  .grouphead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 12px 16px 4px; font-size: 11px; font-weight: 650;
    letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase;
  }
  .grouphead .cnt { font-weight: 500; letter-spacing: 0; }
  .emptycat { padding: 4px 18px 2px; font-size: 12px; color: var(--muted); opacity: 0.75; }
  .groupitems { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 7px 10px; border: 0; border-radius: 8px;
    background: transparent; text-align: left; font-size: 13px; cursor: pointer;
  }
  .row:hover { background: var(--sunk); }
  .row[aria-current="true"] { background: var(--sel); color: var(--accent); font-weight: 600; }
  .rowmain { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--line); }
  .row[aria-current="true"] .dot { background: var(--accent); }
  .rowtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { padding: 24px 16px; color: var(--muted); font-size: 13px; }

  .decisions {
    border-top: 1px solid var(--line); flex-shrink: 0;
    display: flex; flex-direction: column; min-height: 0;
  }
  .decisions[data-open="true"] { max-height: 32vh; }
  .adrhead {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 11px 16px; border: 0; background: transparent; cursor: pointer;
    font-size: 11px; font-weight: 650; letter-spacing: 0.06em;
    color: var(--muted); text-transform: uppercase;
  }
  .adrhead:hover { color: var(--fg); }
  .adrhead .cnt { margin-left: auto; font-weight: 500; letter-spacing: 0; }
  .adrhead svg { flex-shrink: 0; transition: transform 0.12s ease; }
  .decisions[data-open="true"] .adrhead svg { transform: rotate(90deg); }
  .adrbody { overflow: auto; padding: 0 8px 14px; }
  .adrrow {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    padding: 6px 10px; border: 0; border-radius: 8px; background: transparent;
    text-align: left; font-size: 13px; cursor: pointer;
  }
  .adrrow:hover { background: var(--sunk); }
  .adrrow[aria-current="true"] { background: var(--sel); color: var(--accent); font-weight: 600; }
  .adrnum { flex-shrink: 0; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  .adrrow[aria-current="true"] .adrnum { color: var(--accent); }
  .adrtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .struck { text-decoration: line-through; opacity: 0.65; }

  .adr { height: 100%; overflow: auto; padding: 28px 32px 40px; }
  .adr > :first-child { margin-top: 0; }
  .adr h2 { font-size: 15px; font-weight: 650; margin: 26px 0 8px; }
  .adr p { margin: 0 0 12px; max-width: 62ch; line-height: 1.65; text-wrap: pretty; }
  .adr ul { margin: 0 0 12px; padding-left: 20px; max-width: 62ch; }
  .adr li { margin-bottom: 6px; line-height: 1.65; }
  .adr code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

  .pane { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }

  .detailhead { padding: 18px 28px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
  .detailhead h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  .detailhead p { margin: 4px 0 0; color: var(--muted); font-size: 13px; text-wrap: pretty; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  .pill { font-size: 11px; color: var(--muted); background: var(--sunk); border-radius: 999px; padding: 2px 8px; }
  .pill.link { border: 0; cursor: pointer; font: inherit; font-size: 11px; color: var(--accent); background: var(--sel); }
  .pill.ghost { background: transparent; border: 1px dashed var(--line); opacity: 0.7; }
  .stamp { font-size: 11px; color: var(--muted); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 28px; border-bottom: 1px solid var(--line); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); font-size: 13px; cursor: pointer; text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .zoomtoggle { display: none; }

  .stage { flex-grow: 1; padding: 20px 28px 28px; min-height: 0; }
  .frame {
    height: 100%; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); overflow: hidden;
  }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; }
  #excalidraw-stage { height: 100%; overflow: auto; background: #ffffff; padding: 16px; }
  #excalidraw-stage svg { display: block; width: 100%; height: auto; }
  .fallback { padding: 24px; color: var(--muted); }
  .fallback code { background: var(--sunk); padding: 2px 6px; border-radius: 4px; }

  .gallery { flex-grow: 1; overflow: auto; padding: 24px 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .sectionhead { margin: 26px 0 12px; }
  .sectionhead:first-child { margin-top: 0; }
  .sectionhead h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .sectionhead p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .emptycard {
    display: flex; align-items: center; justify-content: center; min-height: 120px;
    border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 13px;
  }
  .card {
    display: block; text-align: left; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card[aria-current="true"] { border-color: var(--accent); }
  .thumb {
    height: 116px; border-radius: 8px; background: var(--sunk);
    display: flex; align-items: center; justify-content: center;
  }
  .cardtitle { font-size: 14px; font-weight: 600; margin-top: 12px; }
  .cardsum { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.45; text-wrap: pretty; }

  @media (max-width: 860px) {
    /* 목록은 서랍으로 밀어 두고, 첫 화면은 다이어그램이 차지한다 */
    .navtoggle { display: inline-flex; }
    .topbar { gap: 10px; padding: 0 14px; }
    .count { display: none; }

    .sidebar {
      position: fixed; z-index: 30; top: 56px; left: 0; right: 0; bottom: 0;
      width: auto; border-right: 0; border-top: 1px solid var(--line);
      transform: translateX(-100%); visibility: hidden;
      transition: transform 0.18s ease, visibility 0.18s;
    }
    body[data-nav="true"] .sidebar { transform: none; visibility: visible; }
    .list { max-height: none; }
    .decisions[data-open="true"] { max-height: 40vh; }

    /* 손가락으로 누를 수 있는 크기로 */
    .row, .adrrow { padding: 11px 12px; font-size: 14px; }
    .tag { padding: 7px 12px; font-size: 13px; }
    .seg button { padding: 8px 14px; }
    .search { height: 42px; }
    .search input { font-size: 16px; }
    .projectpick select { height: 42px; font-size: 14px; }
    .adrhead { padding: 14px 16px; }

    .topbar, .detailhead, .toolbar, .stage, .gallery { padding-left: 16px; padding-right: 16px; }
    .detailhead { padding-top: 14px; padding-bottom: 12px; }
    .detailhead h1 { font-size: 17px; }
    .toolbar { padding-top: 10px; padding-bottom: 10px; }
    .btn { padding: 8px 12px; }
    /* 그림 크기에 맞춰 액자를 줄이고, 넘치면 화면이 스크롤된다 */
    .pane { overflow-y: auto; }
    body[data-nav="true"] .pane { overflow: hidden; }
    .stage { padding-top: 12px; padding-bottom: 16px; flex-grow: 0; }
    .frame { height: auto; }
    .frame iframe { height: 70vh; }
    #excalidraw-stage { height: auto; }
    .zoomtoggle { display: inline-flex; }
    /* 확대 상태에서는 좌우로 밀어서 본다 */
    body[data-zoom="true"] .frame { overflow: auto; }
    body[data-zoom="true"] .frame iframe { max-width: none; }
    body[data-zoom="true"] #excalidraw-stage svg { max-width: none; }
    .adr { padding: 20px 16px 32px; }
    .gallery { padding-top: 16px; padding-bottom: 24px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
  }

  /* 가로로 눕힌 화면 — 머리말이 그림 자리를 덜 먹도록 */
  @media (max-width: 860px) and (max-height: 520px) {
    .detailhead { padding-top: 10px; padding-bottom: 10px; }
    .detailhead p { display: none; }
    .meta { margin-top: 6px; }
    .toolbar { padding-top: 8px; padding-bottom: 8px; }
  }
</style>

<header class="topbar">
  <button class="navtoggle" id="navtoggle" aria-expanded="false" aria-controls="sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path class="ic-open" d="M4 7h16M4 12h16M4 17h16"></path>
      <path class="ic-close" d="M6 6l12 12M18 6L6 18"></path>
    </svg>
    <span class="sr">목록 열기</span>
  </button>
  <div class="brand">
    <button class="home" id="home" title="처음 화면으로">Diagrams</button>
    <span class="count" id="count"></span>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="viewseg" role="group" aria-label="보기 방식"></div>
</header>

<div class="body">
  <aside class="sidebar" id="sidebar">
    <div class="project" id="project"></div>
    <div class="projectpick" id="projectpick" hidden></div>
    <div class="searchwrap">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" style="flex-shrink:0;color:var(--muted)">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="q" type="search" placeholder="제목·태그 검색" aria-label="다이어그램 검색" />
      </div>
    </div>
    <div class="tags" id="tags" role="group" aria-label="태그 필터"></div>
    <div class="axiswrap">
      <div class="seg" id="axisseg" role="group" aria-label="묶는 기준"></div>
    </div>
    <nav class="list" id="list" aria-label="다이어그램 목록"></nav>
    <nav class="decisions" id="decisions" aria-label="설계 결정"></nav>
  </aside>

  <main class="pane">
    <section id="detail" style="display:flex;flex-direction:column;flex-grow:1;min-height:0">
      <div class="detailhead">
        <h1 id="d-title"></h1>
        <p id="d-summary"></p>
        <div class="meta" id="d-meta"></div>
      </div>
      <div class="toolbar">
        <div class="seg" id="fmtseg" role="group" aria-label="형식"></div>
        <div class="spacer"></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px" id="actions"></div>
      </div>
      <div class="stage">
        <div class="frame">
          <iframe id="html-view" title="다이어그램 미리보기" hidden></iframe>
          <div id="excalidraw-stage" hidden></div>
          <div id="adr-stage" class="adr" hidden></div>
      <div id="fallback" class="fallback" hidden></div>
        </div>
      </div>
    </section>

    <section class="gallery" id="gallery" hidden>
      <div id="grid"></div>
    </section>
  </main>
</div>

<script>
  /* ---------- 최소 Excalidraw 렌더러 (외부 라이브러리 없음) ---------- */

  const rng = (seed) => {
    let s = (seed >>> 0) || 1;
    return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  };
  const svgEl = (name, attrs) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    return n;
  };

  // 둥근 사각형 외곽선을 점열로 샘플링
  function roundRectPoints(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    const pts = [];
    const corner = (cx, cy, from) => {
      for (let i = 0; i <= 4; i++) {
        const a = from + (Math.PI / 2) * (i / 4);
        pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
    };
    pts.push([x + r, y]);
    pts.push([x + w - r, y]);
    corner(x + w - r, y + r, -Math.PI / 2);
    pts.push([x + w, y + h - r]);
    corner(x + w - r, y + h - r, 0);
    pts.push([x + r, y + h]);
    corner(x + r, y + h - r, Math.PI / 2);
    pts.push([x, y + r]);
    corner(x + r, y + r, Math.PI);
    return pts;
  }

  const pathFrom = (pts, rand, amp, close) =>
    pts
      .map((p, i) => {
        const jx = p[0] + (rand() - 0.5) * amp;
        const jy = p[1] + (rand() - 0.5) * amp;
        return (i ? 'L' : 'M') + jx.toFixed(1) + ' ' + jy.toFixed(1);
      })
      .join(' ') + (close ? ' Z' : '');

  const DASH = { dashed: '9 7', dotted: '2 5' };

  function drawShape(g, el) {
    const rand = rng(el.seed);
    const pts =
      el.type === 'ellipse'
        ? Array.from({ length: 33 }, (_, i) => {
            const a = (i / 32) * Math.PI * 2;
            return [
              el.x + el.width / 2 + (el.width / 2) * Math.cos(a),
              el.y + el.height / 2 + (el.height / 2) * Math.sin(a),
            ];
          })
        : el.type === 'diamond'
        ? [
            [el.x + el.width / 2, el.y],
            [el.x + el.width, el.y + el.height / 2],
            [el.x + el.width / 2, el.y + el.height],
            [el.x, el.y + el.height / 2],
          ]
        : roundRectPoints(el.x, el.y, el.width, el.height, el.roundness ? 14 : 0);

    if (el.backgroundColor && el.backgroundColor !== 'transparent') {
      g.appendChild(
        svgEl('path', {
          d: pathFrom(pts, rng(el.seed), 0, true),
          fill: el.backgroundColor,
          stroke: 'none',
        })
      );
    }
    const dash = DASH[el.strokeStyle] || null;
    const passes = dash ? 1 : 2;
    for (let i = 0; i < passes; i++) {
      g.appendChild(
        svgEl('path', {
          d: pathFrom(pts, rand, 1.6, true),
          fill: 'none',
          stroke: el.strokeColor,
          'stroke-width': el.strokeWidth,
          'stroke-linecap': 'round',
          'stroke-linejoin': 'round',
          'stroke-dasharray': dash,
          opacity: (el.opacity / 100) * (i ? 0.75 : 1),
        })
      );
    }
  }

  function drawArrow(g, el) {
    const rand = rng(el.seed);
    const pts = el.points.map((p) => [el.x + p[0], el.y + p[1]]);
    const dash = DASH[el.strokeStyle] || null;
    const stroke = {
      fill: 'none',
      stroke: el.strokeColor,
      'stroke-width': el.strokeWidth,
      'stroke-linecap': 'round',
      'stroke-dasharray': dash,
    };
    for (let i = 0; i < (dash ? 1 : 2); i++) {
      g.appendChild(
        svgEl('path', {
          ...stroke,
          d: pathFrom(pts, rand, 1.4, false),
          opacity: i ? 0.75 : 1,
        })
      );
    }
    const head = (tip, prev) => {
      const a = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]);
      for (const s of [1, -1]) {
        const b = a + s * 0.42 + Math.PI;
        g.appendChild(
          svgEl('path', {
            ...stroke,
            'stroke-dasharray': null,
            d:
              'M' + tip[0].toFixed(1) + ' ' + tip[1].toFixed(1) +
              'L' + (tip[0] + 16 * Math.cos(b)).toFixed(1) + ' ' +
              (tip[1] + 16 * Math.sin(b)).toFixed(1),
          })
        );
      }
    };
    if (el.endArrowhead) head(pts[pts.length - 1], pts[pts.length - 2]);
    if (el.startArrowhead) head(pts[0], pts[1]);
  }

  const FONT =
    '"Comic Sans MS", "Segoe Print", "Bradley Hand", "Apple SD Gothic Neo", ' +
    '"Malgun Gothic", ui-rounded, system-ui, sans-serif';

  function drawText(g, el, container, bg) {
    const lines = el.text.split('\n');
    const lh = el.fontSize * (el.lineHeight || 1.25);
    let cx, top, anchor, host = g;
    if (container && container.type === 'arrow') {
      const pts = container.points;
      const mid = Math.floor((pts.length - 1) / 2);
      cx = container.x + (pts[mid][0] + pts[mid + 1][0]) / 2;
      const cy = container.y + (pts[mid][1] + pts[mid + 1][1]) / 2;
      top = cy - (lines.length * lh) / 2;
      anchor = 'middle';
      // 화살표 라벨: 선을 가리는 배경을 깔고, 마운트 후 실제 글자 크기에 맞춘다
      host = svgEl('g', { class: 'arrow-label' });
      host.appendChild(svgEl('rect', { fill: bg, stroke: 'none' }));
      g.appendChild(host);
    } else if (container) {
      cx = container.x + container.width / 2;
      top = container.y + container.height / 2 - (lines.length * lh) / 2;
      anchor = 'middle';
    } else {
      cx = el.x;
      top = el.y;
      anchor = 'start';
    }
    const t = svgEl('text', {
      x: cx, y: top,
      'text-anchor': anchor,
      fill: el.strokeColor,
      'font-family': FONT,
      'font-size': el.fontSize,
      opacity: el.opacity / 100,
    });
    lines.forEach((line, i) => {
      const ts = svgEl('tspan', { x: cx, dy: i === 0 ? lh * 0.78 : lh });
      ts.textContent = line;
      t.appendChild(ts);
    });
    host.appendChild(t);
  }

  // getBBox 는 문서에 붙은 뒤에만 값이 나오므로 마운트 후에 실행한다
  function fitArrowLabels(svg) {
    svg.querySelectorAll('g.arrow-label').forEach((group) => {
      const box = group.querySelector('text').getBBox();
      const rect = group.querySelector('rect');
      rect.setAttribute('x', box.x - 8);
      rect.setAttribute('y', box.y - 4);
      rect.setAttribute('width', box.width + 16);
      rect.setAttribute('height', box.height + 8);
    });
  }

  function renderExcalidraw(doc) {
    const els = doc.elements.filter((e) => !e.isDeleted);
    const byId = Object.fromEntries(els.map((e) => [e.id, e]));
    const bg = (doc.appState && doc.appState.viewBackgroundColor) || '#ffffff';

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const e of els) {
      const xs = e.type === 'arrow' ? e.points.map((p) => e.x + p[0]) : [e.x, e.x + e.width];
      const ys = e.type === 'arrow' ? e.points.map((p) => e.y + p[1]) : [e.y, e.y + e.height];
      minX = Math.min(minX, ...xs); maxX = Math.max(maxX, ...xs);
      minY = Math.min(minY, ...ys); maxY = Math.max(maxY, ...ys);
    }
    const pad = 32;
    const svg = svgEl('svg', {
      viewBox: [minX - pad, minY - pad, maxX - minX + pad * 2, maxY - minY + pad * 2].join(' '),
      xmlns: 'http://www.w3.org/2000/svg',
      role: 'img',
    });
    svg.dataset.w = String(Math.round(maxX - minX + pad * 2));
    const g = svgEl('g', {});
    svg.appendChild(g);
    for (const e of els) {
      if (e.type === 'text') drawText(g, e, e.containerId ? byId[e.containerId] : null, bg);
      else if (e.type === 'arrow' || e.type === 'line') drawArrow(g, e);
      else drawShape(g, e);
    }
    return svg;
  }

  /* ---------- 다운로드 ---------- */

  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // 다이어그램 HTML 은 <style> + 인라인 <svg> 로만 되어 있으므로,
  // 스타일을 svg 안으로 옮기면 그 자체로 열리는 .svg 파일이 된다.
  function toStandaloneSvg(source) {
    const svg = (source.match(/<svg[\s\S]*?<\/svg>/) || [])[0];
    if (!svg) throw new Error('이 문서에서 <svg> 를 찾지 못했습니다');
    const style = (source.match(/<style>([\s\S]*?)<\/style>/) || [, ''])[1]
      // 페이지 레이아웃용 규칙은 단독 SVG 에서 방해만 된다
      .replace(/\b(main|svg)\s*\{[^}]*\}/g, '')
      // body 의 폰트·배경은 살려야 하므로 루트 <svg> 규칙으로 옮긴다
      .replace(/\bbody\s*\{/, 'svg {');
    const vb = ((svg.match(/viewBox="([^"]+)"/) || [, '0 0 800 600'])[1]).trim().split(/\s+/);
    return (
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      svg.replace(
        /<svg\b/,
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + vb[2] + '" height="' + vb[3] + '"'
      ).replace(
        /(<svg[^>]*>)/,
        '$1<style>' + style + '</style>' +
          '<rect x="' + vb[0] + '" y="' + vb[1] + '" width="' + vb[2] + '" height="' + vb[3] +
          '" fill="var(--bg)" />'
      )
    );
  }

  async function downloadSvg(url, name) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    saveBlob(new Blob([toStandaloneSvg(await res.text())], { type: 'image/svg+xml' }), name);
  }

  /* ---------- ADR 본문 (마크다운 부분집합) ---------- */

  // 제목·문단·목록·강조·코드·링크만 다룬다. ADR 을 이 범위 안에서 쓴다.
  function renderMarkdown(md) {
    const inline = (t) =>
      esc(t)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, href) => {
          // 옆 ADR 로 거는 링크는 뷰어 안에서 열리게 바꾼다
          const local = /^(\d{4}-[a-z0-9-]+)\.md$/.exec(href);
          return local
            ? '<a href="#decision/' + local[1] + '">' + text + '</a>'
            : '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + text + '</a>';
        });

    const out = [];
    let para = [];
    let items = null;
    const flushPara = () => {
      if (para.length) out.push('<p>' + inline(para.join(' ')) + '</p>');
      para = [];
    };
    const flushList = () => {
      if (items) out.push('<ul>' + items.join('') + '</ul>');
      items = null;
    };

    for (const raw of md.split('\n')) {
      const line = raw.trim();
      const bullet = /^-\s+(.*)$/.exec(line);
      const head = /^(#{1,4})\s+(.*)$/.exec(line);
      if (bullet) {
        flushPara();
        items = items || [];
        items.push('<li>' + inline(bullet[1]) + '</li>');
      } else if (head) {
        flushPara();
        flushList();
        const n = head[1].length;
        out.push('<h' + n + '>' + inline(head[2]) + '</h' + n + '>');
      } else if (!line) {
        flushPara();
        flushList();
      } else {
        flushList();
        para.push(line);
      }
    }
    flushPara();
    flushList();
    return out.join('');
  }

  /* ---------- 뷰어 ---------- */

  const ALIASES = { mvc: 'mvc-structure', 'mvc-sequence': 'mvc-sequence' };

  const el = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );

  const ICON_OPEN = 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5';
  const ICON_DL = 'M12 4v11M7 12l5 5 5-5M4 20h16';
  const ICON_ZOOM = 'M11 4a7 7 0 100 14 7 7 0 000-14M20 20l-4.7-4.7M8.5 11h5M11 8.5v5';
  const ICON_FIT = 'M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5';
  const icon = (d) =>
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"></path></svg>';
  const THUMB =
    '<svg width="76" height="52" viewBox="0 0 76 52" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" style="color:var(--muted)">' +
    '<rect x="24" y="1" width="28" height="14" rx="3" fill="var(--card)"></rect>' +
    '<rect x="1" y="19" width="28" height="14" rx="3" fill="var(--card)"></rect>' +
    '<rect x="47" y="19" width="28" height="14" rx="3" fill="var(--card)"></rect>' +
    '<rect x="24" y="37" width="28" height="14" rx="3" fill="var(--card)"></rect>' +
    '<path d="M31 15L20 19M45 15L56 19M20 33L31 37M56 33L45 37"></path></svg>';

  const state = { q: '', tag: null, sel: null, fmt: 'html', view: 'list', allTags: false, axis: 'phase', adr: null, adrOpen: false, project: null, nav: false, zoom: false };
  let INDEX = { categories: [], tags: [], diagrams: [] };
  const byId = new Map();
  const adrById = new Map();

  const current = () => byId.get(state.sel) || INDEX.diagrams.filter(inProject)[0];

  // 같은 다이어그램을 설계 단계로도, 그림 종류로도 묶어 볼 수 있게 한다
  const groups = () =>
    state.axis === 'phase'
      ? INDEX.phases.map((p) => ({ ...p, of: (d) => d.phase === p.id }))
      : INDEX.categories.map((c) => ({ ...c, of: (d) => d.category === c.id }));

  const inProject = (x) => !state.project || x.project === state.project;

  function hits() {
    const needle = state.q.trim().toLowerCase();
    return INDEX.diagrams.filter(inProject).filter((d) => {
      const q =
        !needle ||
        d.title.toLowerCase().includes(needle) ||
        d.summary.toLowerCase().includes(needle) ||
        d.tags.some((t) => t.toLowerCase().includes(needle));
      return q && (!state.tag || d.tags.includes(state.tag));
    });
  }

  function segment(host, items, onPick) {
    host.replaceChildren();
    for (const it of items) {
      const b = document.createElement('button');
      b.textContent = it.label;
      b.setAttribute('aria-pressed', String(it.on));
      if (it.title) b.title = it.title;
      if (it.disabled) b.disabled = true;
      b.addEventListener('click', () => onPick(it.value));
      host.appendChild(b);
    }
  }

  function renderChrome() {
    const mine = INDEX.diagrams.filter(inProject).length;
    el('count').textContent =
      mine + '개 · ' +
      (state.axis === 'phase' ? 'SDLC 단계 ' + INDEX.phases.length : '카테고리 ' + INDEX.categories.length) + '개';
    const p = INDEX.projects.find((x) => x.id === state.project) || INDEX.projects[0];
    el('project').innerHTML = p
      ? '<strong>' + esc(p.name) + '</strong><span>' + esc(p.summary) +
        (p.missing && p.missing.length
          ? ' · <em>남은 대표 종류 ' + p.missing.length + '개</em>'
          : '') +
        '</span>'
      : '';
    // 프로젝트가 둘 이상일 때만 전환기를 보인다
    const pick = el('projectpick');
    pick.hidden = INDEX.projects.length < 2;
    if (!pick.hidden && !pick.firstChild) {
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', '프로젝트 선택');
      for (const x of INDEX.projects) {
        const o = document.createElement('option');
        o.value = x.id;
        o.textContent = x.name + ' · ' + x.status;
        sel.appendChild(o);
      }
      sel.addEventListener('change', () => switchProject(sel.value));
      pick.appendChild(sel);
    }
    if (!pick.hidden) pick.firstChild.value = state.project || INDEX.projects[0].id;
    segment(
      el('axisseg'),
      [
        { label: 'SDLC 단계', value: 'phase', on: state.axis === 'phase' },
        { label: '그림 종류', value: 'category', on: state.axis === 'category' },
      ],
      (v) => {
        state.axis = v;
        render();
      }
    );
    segment(
      el('viewseg'),
      [
        { label: '목록', value: 'list', on: state.view === 'list' },
        { label: '갤러리', value: 'grid', on: state.view === 'grid' },
      ],
      (v) => {
        state.view = v;
        render();
      }
    );
    const host = el('tags');
    host.replaceChildren();
    const LIMIT = 8;
    // 태그는 활성 프로젝트에 실제로 쓰인 것만 보인다 — 눌러도 아무것도 안 나오는
    // 태그가 섞이면 필터가 아니라 소음이 된다
    const all = [...new Set(INDEX.diagrams.filter(inProject).flatMap((d) => d.tags))].sort((a, b) =>
      a.localeCompare(b, 'ko')
    );
    // 태그가 늘어나면 목록을 아래로 밀어내므로, 기본은 접어 둔다
    const shown = state.allTags || all.length <= LIMIT + 1 ? all : all.slice(0, LIMIT);
    for (const t of shown) {
      const b = document.createElement('button');
      b.className = 'tag';
      b.textContent = t;
      b.setAttribute('aria-pressed', String(state.tag === t));
      b.addEventListener('click', () => {
        state.tag = state.tag === t ? null : t;
        render();
      });
      host.appendChild(b);
    }
    if (shown.length < all.length || state.allTags) {
      const more = document.createElement('button');
      more.className = 'tag more';
      more.textContent = state.allTags ? '접기' : '+' + (all.length - shown.length);
      more.addEventListener('click', () => {
        state.allTags = !state.allTags;
        render();
      });
      host.appendChild(more);
    }
  }

  function renderList(list) {
    const host = el('list');
    host.replaceChildren();
    const filtering = state.q.trim() !== '' || state.tag !== null;
    if (filtering && list.length === 0) {
      const p = document.createElement('div');
      p.className = 'note';
      p.textContent = '조건에 맞는 다이어그램이 없습니다.';
      host.appendChild(p);
      return;
    }
    for (const cat of groups()) {
      const items = list.filter(cat.of);
      // 필터가 걸려 있을 때만 빈 묶음을 감춘다.
      // 평소에는 아직 그리지 않은 칸이 보이는 편이 낫다.
      if (items.length === 0 && filtering) continue;
      const h = document.createElement('div');
      h.className = 'grouphead';
      h.title = cat.summary;
      h.innerHTML =
        '<span>' + esc(cat.name) + '</span>' +
        '<span class="cnt">' + (items.length || '—') + '</span>';
      host.appendChild(h);
      if (items.length === 0) {
        const e = document.createElement('div');
        e.className = 'emptycat';
        e.textContent = cat.kinds
          ? '아직 없음 · ' + cat.kinds.slice(0, 2).map((k) => k.name).join(' · ')
          : '아직 없음';
        host.appendChild(e);
        continue;
      }
      const box = document.createElement('div');
      box.className = 'groupitems';
      for (const d of items) {
        const b = document.createElement('button');
        b.className = 'row';
        // 결정을 보는 동안에는 어떤 다이어그램도 현재가 아니다
        b.setAttribute('aria-current', String(state.adr === null && d.id === state.sel));
        b.innerHTML =
          '<span class="rowmain"><span class="dot"></span>' +
          '<span class="rowtitle">' + esc(d.title) + '</span></span>';
        b.addEventListener('click', () => select(d.id));
        box.appendChild(b);
      }
      host.appendChild(box);
    }
  }

  function renderDecisionList() {
    const host = el('decisions');
    host.replaceChildren();
    const all = (INDEX.decisions || []).filter(inProject);
    host.hidden = all.length === 0;
    if (host.hidden) return;

    // 사이드바의 주인공은 다이어그램 목록이므로 결정은 접어 둔다.
    // 결정을 보고 있는 중이면 저절로 펼쳐진다.
    const open = state.adrOpen || state.adr !== null;
    host.dataset.open = String(open);

    const head = document.createElement('button');
    head.className = 'adrhead';
    head.setAttribute('aria-expanded', String(open));
    head.innerHTML =
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>' +
      '<span>설계 결정</span><span class="cnt">' + all.length + '</span>';
    head.addEventListener('click', () => {
      state.adrOpen = !open;
      // 접으면서 보고 있던 결정도 닫아, 다이어그램 화면으로 돌아간다
      if (!state.adrOpen) state.adr = null;
      render();
    });
    host.appendChild(head);
    if (!open) return;

    const box = document.createElement('div');
    box.className = 'adrbody';
    for (const a of all) {
      const b = document.createElement('button');
      b.className = 'adrrow';
      b.setAttribute('aria-current', String(a.id === state.adr));
      // 대체되거나 폐기된 결정은 취소선으로 남긴다 — 지우지 않는 것이 ADR 의 요점이다
      const dead = a.status === '대체됨' || a.status === '폐기됨';
      b.innerHTML =
        '<span class="adrnum">' + esc(a.number) + '</span>' +
        '<span class="adrtitle' + (dead ? ' struck' : '') + '">' + esc(a.title) + '</span>';
      b.title = a.status + ' · ' + a.date;
      b.addEventListener('click', () => selectDecision(a.id));
      box.appendChild(b);
    }
    host.appendChild(box);
  }

  function renderGrid(list) {
    const host = el('grid');
    host.replaceChildren();
    const filtering = state.q.trim() !== '' || state.tag !== null;
    if (filtering && list.length === 0) {
      const p = document.createElement('div');
      p.className = 'note';
      p.textContent = '조건에 맞는 다이어그램이 없습니다.';
      host.appendChild(p);
      return;
    }
    for (const cat of groups()) {
      const items = list.filter(cat.of);
      if (items.length === 0 && filtering) continue;

      const head = document.createElement('div');
      head.className = 'sectionhead';
      head.innerHTML =
        '<h2>' + esc(cat.name) + '</h2>' +
        '<p>' + esc(cat.summary) + '</p>' +
        (cat.kinds
          ? '<div class="kinds">' +
            cat.kinds
              .map((k) => '<span class="pill' + (k.covered ? '' : ' ghost') + '">' + esc(k.name) + '</span>')
              .join('') +

  async function renderDecision() {
    const a = adrById.get(state.adr);
    if (!a) return;
    el('d-title').textContent = a.number + '. ' + a.title;
    el('d-summary').textContent = '';
    el('d-meta').innerHTML =
      '<span class="pill">' + esc(a.status) + '</span>' +
      (a.supersedes
        ? '<span class="pill">' + esc(adrById.get(a.supersedes).number) + ' 대체</span>'
        : '') +
      a.diagrams
        .map((id) => {
          const d = byId.get(id);
          return d ? '<button class="pill link" data-go="' + esc(id) + '">' + esc(d.title) + '</button>' : '';
        })
        .join('') +
      '<span class="stamp">· ' + esc(a.date) + '</span>';
    el('d-meta')
      .querySelectorAll('[data-go]')
      .forEach((b) => b.addEventListener('click', () => select(b.dataset.go)));

    el('fmtseg').replaceChildren();
    el('fmtseg').hidden = true;
    const actions = el('actions');
    actions.replaceChildren();
    const src = document.createElement('a');
    src.className = 'btn';
    src.href = a.path;
    src.target = '_blank';
    src.rel = 'noopener';
    src.innerHTML = icon(ICON_OPEN) + '<span>원본 .md</span>';
    actions.appendChild(src);

    try {
      const res = await fetch(a.path, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const body = (await res.text()).replace(/^---\n[\s\S]*?\n---\n/, '');
      el('adr-stage').innerHTML = renderMarkdown(body);
      show('adr');
    } catch (err) {
      showError('<p><strong>결정 문서를 불러오지 못했습니다.</strong> (' + esc(err.message) + ')</p>');
    }
  }

  function renderDetail() {
    const d = current();
    if (!d) return;
    el('d-title').textContent = d.title;
    el('d-summary').textContent = d.summary;
    const ph = INDEX.phases.find((x) => x.id === d.phase);
    el('d-meta').innerHTML =
      (ph ? '<span class="pill">' + esc(ph.name) + '</span>' : '') +
      d.tags.map((t) => '<span class="pill">' + esc(t) + '</span>').join('') +
      (d.decisions || [])
        .map((id) => {
          const a = adrById.get(id);
          return a ? '<button class="pill link" data-adr="' + esc(id) + '">ADR ' + esc(a.number) + '</button>' : '';
        })
        .join('') +
      (d.updated ? '<span class="stamp">· 수정 ' + esc(d.updated) + '</span>' : '');
    el('d-meta')
      .querySelectorAll('[data-adr]')
      .forEach((b) => b.addEventListener('click', () => selectDecision(b.dataset.adr)));

    el('fmtseg').hidden = false;
    segment(
      el('fmtseg'),
      [
        { label: 'SVG / HTML', value: 'html', on: state.fmt === 'html' },
        {
          label: d.formats.excalidraw ? 'Excalidraw' : 'Excalidraw 없음',
          value: 'excalidraw',
          on: state.fmt === 'excalidraw',
          disabled: !d.formats.excalidraw,
          title: d.formats.excalidraw
            ? null
            : '이 다이어그램에는 편집용 .excalidraw 파일이 없습니다. SVG/HTML 만 있습니다.',
        },
      ],
      (v) => {
        state.fmt = v;
        render();
      }
    );

    const actions = el('actions');
    actions.replaceChildren();

    // 좁은 화면 전용 — 화면 맞춤 ↔ 원래 크기
    const zb = document.createElement('button');
    zb.className = 'btn zoomtoggle' + (state.zoom ? ' primary' : '');
    zb.setAttribute('aria-pressed', String(state.zoom));
    zb.innerHTML =
      icon(state.zoom ? ICON_FIT : ICON_ZOOM) +
      '<span>' + (state.zoom ? '맞춤' : '확대') + '</span>';
    zb.title = state.zoom
      ? '화면 너비에 맞춰 전체를 봅니다'
      : '원래 크기로 봅니다 — 좌우로 밀어서 읽으세요';
    zb.addEventListener('click', () => {
      state.zoom = !state.zoom;
      applyZoom();
      renderDetail();
    });
    actions.appendChild(zb);

    const link = (label, href, download, primary) => {
      const a = document.createElement('a');
      a.className = 'btn' + (primary ? ' primary' : '');
      a.href = href;
      a.innerHTML = icon(download ? ICON_DL : ICON_OPEN) + '<span>' + esc(label) + '</span>';
      if (download) a.download = download;
      else {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      actions.appendChild(a);
    };

    if (state.fmt === 'html') {
      link('새 탭', d.formats.html);
      link('.html', d.formats.html, d.id + '.html');
      const b = document.createElement('button');
      b.className = 'btn primary';
      b.innerHTML = icon(ICON_DL) + '<span>.svg</span>';
      b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          await downloadSvg(d.formats.html, d.id + '.svg');
        } catch (err) {
          showError('SVG 를 만들지 못했습니다 (' + err.message + ').');
        } finally {
          b.disabled = false;
        }
      });
      actions.appendChild(b);
    } else {
      link('원본 JSON', d.formats.excalidraw);
      link('.excalidraw', d.formats.excalidraw, d.id + '.excalidraw');
    }
  }

  function show(which) {
    el('html-view').hidden = which !== 'html';
    el('excalidraw-stage').hidden = which !== 'excalidraw';
    el('adr-stage').hidden = which !== 'adr';
    el('fallback').hidden = which !== 'error';
  }

  function showError(html) {
    el('fallback').innerHTML = html;
    show('error');
  }

  async function renderStage() {
    const d = current();
    if (!d) return;
    if (state.fmt === 'excalidraw' && d.formats.excalidraw) {
      try {
        const res = await fetch(d.formats.excalidraw, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const stage = el('excalidraw-stage');
        stage.replaceChildren(renderExcalidraw(await res.json()));
        show('excalidraw');
        fitArrowLabels(stage);
        applyZoom();
      } catch (err) {
        showError(
          '<p><strong>Excalidraw 파일을 불러오지 못했습니다.</strong> (' + esc(err.message) + ')</p>' +
          '<p><code>file://</code> 로 직접 열면 브라우저 보안 정책 때문에 파일을 읽을 수 없습니다. ' +
          '저장소 폴더에서 <code>python3 -m http.server</code> 를 실행해 ' +
          '<code>http://localhost:8000</code> 으로 열거나, GitHub Pages 로 보세요.</p>'
        );
      }
      return;
    }
    el('html-view').src = d.formats.html;
    show('html');
    applyZoom();
  }

  // 좁은 화면에서는 액자를 그림 높이에 맞춘다 — 아래에 빈 흰 상자가 남지 않도록
  const narrow = () => window.matchMedia('(max-width: 860px)').matches;

  // 확대 상태의 다이어그램 문서 너비 (main max-width 980 + 좌우 여백 20)
  const ZOOM_W = 1020;

  function applyZoom() {
    const on = state.zoom && narrow();
    document.body.dataset.zoom = String(on);
    el('html-view').style.width = on ? ZOOM_W + 'px' : '';
    const stage = el('excalidraw-stage');
    const svg = stage.querySelector('svg');
    if (svg) svg.style.width = on && svg.dataset.w ? svg.dataset.w + 'px' : '';
    fitHtmlView();
  }

  function fitHtmlView() {
    const f = el('html-view');
    f.style.height = '';
    if (!narrow()) return;
    try {
      const doc = f.contentDocument;
      if (!doc) return;
      // 액자를 0으로 접고 재면 뷰포트가 아니라 내용 높이가 나온다
      f.style.height = '0px';
      const h = Math.ceil(doc.documentElement.scrollHeight) + 2;
      f.style.height = h > 80 ? h + 'px' : '';
    } catch (err) {
      /* 다른 출처면 CSS 기본값(70vh)에 맡긴다 */
    }
  }

  el('html-view').addEventListener('load', fitHtmlView);
  window.addEventListener('resize', applyZoom);

  function render() {
    const list = hits();
    document.body.dataset.nav = String(state.nav);
    el('navtoggle').setAttribute('aria-expanded', String(state.nav));
    el('navtoggle').querySelector('.sr').textContent = state.nav ? '목록 닫기' : '목록 열기';
    renderChrome();
    renderList(list);
    el('detail').hidden = state.view !== 'list';
    el('gallery').hidden = state.view !== 'grid';
    renderDecisionList();
    if (state.view === 'grid') {
      renderGrid(list);
    } else if (state.adr) {
      renderDecision();
    } else {
      renderDetail();
      renderStage();
    }
    location.hash =
      state.view === 'grid'
        ? 'gallery'
        : state.adr
        ? 'decision/' + state.adr
        : state.sel + '/' + state.fmt;
  }

  // 첫 화면으로: 검색·태그·결정을 모두 풀고 첫 프로젝트의 첫 다이어그램을 연다
  function goHome() {
    state.q = '';
    state.tag = null;
    state.allTags = false;
    state.adr = null;
    state.adrOpen = false;
    state.nav = false;
    state.zoom = false;
    state.view = 'list';
    state.axis = 'phase';
    state.fmt = 'html';
    el('q').value = '';
    const first = INDEX.projects[0];
    state.project = first ? first.id : null;
    const d = INDEX.diagrams.find((x) => x.project === state.project);
    state.sel = d ? d.id : null;
    render();
  }

  el('home').addEventListener('click', goHome);

  el('navtoggle').addEventListener('click', () => {
    state.nav = !state.nav;
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.nav) {
      state.nav = false;
      render();
    }
  });

  function switchProject(id) {
    const p = INDEX.projects.find((x) => x.id === id);
    if (!p) return;
    state.project = id;
    state.adr = null;
    state.tag = null;
    state.q = '';
    el('q').value = '';
    const first = INDEX.diagrams.find((d) => d.project === id);
    state.sel = first ? first.id : null;
    if (state.sel && state.fmt === 'excalidraw' && !byId.get(state.sel).formats.excalidraw) {
      state.fmt = 'html';
    }
    render();
  }

  function selectDecision(id) {
    const a = adrById.get(id);
    if (!a) return;
    state.project = a.project;
    state.adr = id;
    state.nav = false;
    state.view = 'list';
    render();
  }

  function select(id) {
    const d = byId.get(id);
    if (!d) return;
    state.adr = null;
    state.nav = false;
    state.project = d.project;
    state.sel = id;
    if (state.fmt === 'excalidraw' && !d.formats.excalidraw) state.fmt = 'html';
    render();
  }

  function applyHash() {
    const raw = decodeURIComponent(location.hash.slice(1));
    state.view = raw === 'gallery' ? 'grid' : 'list';
    if (raw.startsWith('decision/')) {
      const id = raw.slice('decision/'.length);
      if (adrById.has(id)) {
        state.adr = id;
        state.project = adrById.get(id).project;
        return;
      }
    }
    state.adr = null;
    const [rawId, fmt] = raw.split('/');
    const id = ALIASES[rawId] || rawId;
    if (byId.has(id)) {
      state.sel = id;
      state.project = byId.get(id).project;
    }
    if (fmt === 'html' || fmt === 'excalidraw') state.fmt = fmt;
    const d = current();
    if (d && state.fmt === 'excalidraw' && !d.formats.excalidraw) state.fmt = 'html';
  }

  el('q').addEventListener('input', (e) => {
    state.q = e.target.value;
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== el('q')) {
      e.preventDefault();
      el('q').focus();
    }
  });

  window.addEventListener('hashchange', () => {
    applyHash();
    render();
  });

  (async function boot() {
    try {
      const res = await fetch('diagrams.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      INDEX = await res.json();
    } catch (err) {
      document.querySelector('.body').innerHTML =
        '<div class="note" style="padding:32px">' +
        '<p><strong>목록(diagrams.json)을 불러오지 못했습니다.</strong> (' + esc(err.message) + ')</p>' +
        '<p><code>file://</code> 로 직접 열면 브라우저가 파일을 읽지 못합니다. ' +
        '저장소 폴더에서 <code>python3 -m http.server</code> 를 실행해 ' +
        '<code>http://localhost:8000</code> 으로 열거나, GitHub Pages 로 보세요.</p></div>';
      return;
    }
    for (const d of INDEX.diagrams) byId.set(d.id, d);
    for (const a of INDEX.decisions || []) adrById.set(a.id, a);
    state.project = INDEX.projects[0] && INDEX.projects[0].id;
    state.sel = INDEX.diagrams[0] && INDEX.diagrams[0].id;
    applyHash();
    render();
  })();
</script>
</html>

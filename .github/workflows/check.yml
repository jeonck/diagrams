name: Check

# 배포 워크플로는 main 에 들어온 뒤에야 검사한다. 그러면 남이 올린 PR 은
# 머지된 다음에 잘못이 드러난다. 여기서 먼저 막는다.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-freshness 가 코드 변경일을 보려면 전체 이력이 필요하다
          fetch-depth: 0

      # meta.json 과 diagrams.json 이 어긋난 채로 들어오는 것을 막는다
      - name: Check diagram index
        run: node tools/build-index.mjs --check

      # 스펙과 그림 파일이 어긋난 채로 들어오는 것을 막는다
      - name: Check generated diagrams
        run: python3 tools/generators/build.py --check

      # 낡았을 수 있는 다이어그램을 잡 요약에 남긴다. 병합을 막지는 않는다.
      - name: Report stale diagrams
        run: node tools/check-freshness.mjs

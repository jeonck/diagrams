name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-freshness 가 코드 변경일을 보려면 전체 이력이 필요하다
          fetch-depth: 0

      # enablement: true 로 저장소의 Pages를 처음 실행 때 자동으로 켠다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 도구가 잘못 동작하면 검사들이 통과해도 소용없다. 도구부터 본다.
      - name: Test tools
        run: node --test tools/tests/*.test.mjs

      # meta.json 과 diagrams.json 이 어긋난 채로 배포되는 것을 막는다
      - name: Check diagram index
        run: node tools/build-index.mjs --check

      # 스펙과 그림 파일이 어긋난 채로 배포되는 것을 막는다.
      # 손으로 diagram.html 을 고치면 여기서 걸린다.
      - name: Check generated diagrams
        run: python3 tools/generators/build.py --check

      # 낡았을 수 있는 다이어그램을 잡 요약에 남긴다. 배포는 막지 않는다 —
      # 낡음은 "틀렸다" 가 아니라 "확인해 보라" 는 신호다.
      - name: Report stale diagrams
        run: node tools/check-freshness.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./.claude \
                    --exclude=./tools --exclude=./_site . \
            | tar -xf - -C _site
          touch _site/.nojekyll
          find _site -mindepth 1 | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
